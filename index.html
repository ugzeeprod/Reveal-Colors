<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Pixel Cannon — Stitch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap');

  :root {
    --cell: min(3.2vw, 22px);
    --gap: 0px;
    --fs: 32px;
    --bg: #0a0e1f;
    --panel: #16171e;
    --surface: #1e1f28;
    --text: #eaeaf2;
    --muted: #7a7e8f;
    --accent: #ff6b4a;
    --success: #4ade80;
    --danger: #f87171;
    --col-W: #f0f0f0;
    --col-DB: #14288C;
    --col-LB: #28AADC;
    --col-P: #F0AAB4;
    --col-K: #141414;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden; height:100vh; height:100dvh;
  }

  .app {
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    max-width:520px; margin:0 auto;
  }

  .header {
    display:flex; align-items:center; justify-space-between;
    padding:8px 14px; flex-shrink:0;
  }
  .header h1 {
    font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:700;
    background:linear-gradient(135deg,#28AADC,#F0AAB4,#ff6b4a);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .stats { display:flex; gap:12px; font-size:.75rem; color:var(--muted); }
  .stats b { color:var(--text); }
  .stats .hl { color:var(--success); font-weight:700; }

  .grid-section {
    flex:1 1 auto;
    display:flex; align-items:center; justify-content:center;
    padding:2px 8px; min-height:0; overflow:hidden;
  }

  .grid-outer {
    position:relative;
    background:var(--panel); border-radius:14px; padding:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .rail-border {
    position:absolute; inset:4px;
    border:3px solid #2a2c38;
    border-radius:11px; pointer-events:none; z-index:5;
    transition:border-color 300ms;
  }
  .rail-border.active { border-color:var(--accent); }

  .grid {
    display:grid;
    grid-template-columns:repeat(20,var(--cell));
    grid-auto-rows:var(--cell);
    gap:var(--gap); position:relative; z-index:1;
    /* Isole le layout/paint de la grille du reste de la page : sur les gros
       dessins (ex: 51×51 = 2601 cases), ça évite au navigateur de recalculer
       toute la mise en page à chaque case posée. */
    contain:layout paint;
  }

  .gc { border-radius:0; position:relative; background:#2a2b33; }
  /* Mode mystère : le modèle est caché, toutes les cases vides sont neutres */
  .grid.mystery .gc { background:#26272e; }
  /* Case vide (fond, pas dans le dessin) : invisible en mode normal... */
  .gc-void { background:transparent; }
  /* ...mais en mode mystère elle prend la même teinte que les cases du dessin,
     pour que le contour de la silhouette (ex: l'ourson) ne se voie plus. */
  .grid.mystery .gc-void { background:#26272e; }
  .peek-btn { margin-left:auto; }
  .stage-info { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; }
  .tier-badge { font-size:10px; padding:3px 9px; border-radius:10px; font-weight:800; letter-spacing:.5px; }
  .tier-badge.facile    { background:#1db95426; color:#3ce87c; }
  .tier-badge.moyen     { background:#f5a62326; color:#ffc457; }
  .tier-badge.difficile { background:#e8394233; color:#ff5c66; animation:hardPulse 1.1s infinite; }
  @keyframes hardPulse { 50% { transform:scale(1.1); } }
  .peek-btn.revealed { background:var(--accent); color:#fff; }
  .gc.gW  { background:#3a3b44; }
  .gc.gDB { background:#14288C22; }
  .gc.gLB { background:#28AADC22; }
  .gc.gP  { background:#F0AAB422; }
  .gc.gK  { background:#14141422; }
  .gc.blocked::after {
    content:'✕'; position:absolute; inset:0;
    display:grid; place-items:center;
    color:var(--danger); font-size:.5rem; font-weight:800;
    opacity:.8; pointer-events:none; z-index:3;
  }

  .cube { position:absolute; inset:0; border-radius:0; z-index:2; pointer-events:none; }
  .cube.cW {
    background:linear-gradient(145deg,#fff,#f0f0f0 50%,#e0e0e0);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.08);
  }
  .cube.cDB {
    background:linear-gradient(145deg,#1a35a8,#14288C 50%,#0f1e6a);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .cube.cLB {
    background:linear-gradient(145deg,#3cc4f0,#28AADC 50%,#1d8ab5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.25);
  }
  .cube.cP {
    background:linear-gradient(145deg,#f8c4cc,#F0AAB4 50%,#d8909a);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.15);
  }
  .cube.cK {
    background:linear-gradient(145deg,#2a2a2a,#141414 50%,#000);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.5);
  }
  @keyframes cubePop {
    0%{transform:scale(0);opacity:0}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}
  }
  .cube.pop { animation:cubePop 220ms cubic-bezier(.34,1.56,.64,1) both; }

  /* BOTTOM */
  .bottom {
    flex-shrink:0;
    padding:6px 10px 10px;
    display:flex; flex-direction:column; gap:6px;
  }

  .fire-row { display:flex; align-items:center; gap:6px; }
  .fire-label {
    font-size:.55rem; color:var(--muted); text-transform:uppercase;
    letter-spacing:.08em; font-weight:700;
    writing-mode:vertical-rl; transform:rotate(180deg);
  }
  .fire-zone {
    flex:1; display:flex; align-items:center; justify-content:center;
    gap:5px; padding:5px 8px;
    background:var(--panel); border-radius:10px;
    border:2px solid rgba(255,255,255,.06);
    transition:border-color 300ms;
    margin-left:14px;
    position:relative;
  }
  .fire-zone.active { border-color:var(--accent); }
  .fire-slot {
    width:calc(var(--fs, 32px) + 10px); height:calc(var(--fs, 32px) + 10px);
    border-radius:8px; position:relative;
    border:2px dashed rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:border-color 200ms, background 200ms;
  }
  @media (max-width:600px) {
    .fire-zone { padding:4px 6px; gap:4px; }
    .stage-info { font-size:12px; }
    .level-btn { padding:4px 8px; font-size:11px; }
  }
  .fire-slot.locked { opacity:.3; position:relative; }
  .fire-slot.locked::after {
    content:'🔒'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--fs, 32px) * .5);
  }
  .bonus-row { display:flex; gap:6px; padding:2px 0 4px; }
  .bonus-btn {
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    font-family:'Fredoka',sans-serif; font-size:.68rem; font-weight:600;
    padding:6px 4px; border-radius:9px; border:none; cursor:pointer;
    background:var(--surface); color:var(--text);
    transition:all 120ms;
  }
  .bonus-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.35); }
  .bonus-btn:disabled { opacity:.35; cursor:not-allowed; }
  .bonus-btn .bonus-icon { font-size:.95rem; }
  .bonus-btn .bonus-name { display:none; }
  .bonus-btn .bonus-count {
    font-weight:800; background:rgba(255,255,255,.12);
    border-radius:6px; padding:0 5px; min-width:16px; text-align:center;
  }
  .bonus-btn.armed { background:var(--accent); color:#fff; animation:armedPulse 1s ease-in-out infinite; }
  @keyframes armedPulse {
    0%,100% { box-shadow:0 0 0 rgba(255,255,255,0); }
    50%     { box-shadow:0 0 12px rgba(255,255,255,.6); }
  }
  @media (min-width:420px) {
    .bonus-btn .bonus-name { display:inline; }
  }
  .cannons-box.wild-armed .cannon.buried {
    cursor:pointer; opacity:.9; pointer-events:auto;
    animation:wildGlow 1s ease-in-out infinite;
  }
  @keyframes wildGlow {
    0%,100% { box-shadow:0 0 0 rgba(255,255,255,0); }
    50%     { box-shadow:0 0 10px 2px var(--accent); }
  }
  .cannons-box.shuffle-pop { animation:shufflePop 320ms ease; }
  @keyframes shufflePop {
    0%   { transform:scale(1); }
    40%  { transform:scale(1.02); }
    100% { transform:scale(1); }
  }
  .fire-slot.occupied {
    background:var(--surface);
    border-color:rgba(255,255,255,.15);
    box-shadow:0 2px 8px rgba(0,0,0,.4);
    animation:slotIn 220ms cubic-bezier(.34,1.56,.64,1) both;
  }
  .fire-slot.fusion {
    animation: fusionPop 0.4s ease-out;
  }
  @keyframes fusionPop {
    0%   { transform: scale(1);    box-shadow: 0 0 0 rgba(255,200,50,0); }
    40%  { transform: scale(1.25); box-shadow: 0 0 18px rgba(255,200,50,.9); }
    100% { transform: scale(1);    box-shadow: 0 0 0 rgba(255,200,50,0); }
  }
  .fire-slot .fs-dot { width:74%; height:74%; border-radius:5px; }
  /* Compteur du combo en surimpression sur la pastille */
  .fire-slot .fs-count {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',sans-serif; font-size:.62rem; font-weight:800; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6);
    pointer-events:none;
  }
  .wz-count-badge {
    font-family:'Fredoka',sans-serif; font-size:.8rem; font-weight:700;
    color:var(--muted); min-width:28px; text-align:center;
    transition: color 200ms;
  }
  .wz-count-badge.danger { color: var(--danger); }
  /* flying pixel animation */
  .fly-pixel {
    position: fixed;
    width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none; z-index: 999;
    will-change: transform, opacity;
    animation: flyUp 0.28s ease-out forwards;
  }
  @keyframes flyUp {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
  }

  /* ── Feux d'artifice de victoire ─────────────────────────────────── */
  .fireworks-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 998;
    overflow: hidden;
  }
  .fw-particle {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    will-change: transform, opacity;
    animation: fwBurst var(--fw-dur, 900ms) cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes fwBurst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    70%  { opacity: 1; }
    100% { transform: translate(var(--fx), var(--fy)) scale(.3); opacity: 0; }
  }
  .fw-flash {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 12px 4px #fff;
    animation: fwFlash 350ms ease-out forwards;
  }
  @keyframes fwFlash {
    0%   { transform: scale(0); opacity: 1; }
    40%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .fw-rocket {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px 2px currentColor;
    will-change: left, top;
  }
  .fw-rocket::after {
    content: ''; position: absolute; left: 50%; top: 100%;
    width: 2px; height: 32px; transform: translateX(-50%);
    background: linear-gradient(to bottom, currentColor, transparent);
    opacity: .6; border-radius: 2px;
  }

  .cannons-box { display:flex; flex-direction:column; gap:5px; align-items:center; }
  .cannons-row { display:flex; justify-content:center; gap:8px; flex-wrap:nowrap; }
  .wall-grid { display:grid; gap:4px; justify-content:center; width:fit-content; margin:0 auto; }
  .wall-cell { border-radius:6px; width:var(--wc,40px); height:var(--wc,40px); display:flex; }
  .wall-cell.hole { border:1px dashed rgba(255,255,255,.08); background:rgba(255,255,255,.02); }
  .wall-fly { pointer-events:none; display:flex; align-items:center; justify-content:center; }
  /* Canons qui remontent depuis le bas de leur colonne */
  @keyframes riseIn {
    from { transform:translateY(160%); opacity:0; }
    to   { transform:translateY(0); opacity:1; }
  }
  .cannon.rising { animation:riseIn 260ms cubic-bezier(.22,1,.36,1) both; }
  .wall-grid-wrap { position:relative; display:inline-block; }
  .link-rope-layer { position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
  .rope-shadow { stroke:rgba(0,0,0,.45); stroke-width:7; stroke-linecap:round; }
  .rope-line {
    stroke-width:5; stroke-linecap:round;
    stroke-dasharray:1 5.5; /* effet "corde torsadée" */
  }
  .rope.link-0 .rope-line { stroke:#e0a24a; }
  .rope.link-1 .rope-line { stroke:#4a8fe0; }
  .rope.link-2 .rope-line { stroke:#4caf6d; }
  .rope.link-3 .rope-line { stroke:#e0574a; }
  .rope.link-4 .rope-line { stroke:#b04ae0; }
  .rope.link-5 .rope-line { stroke:#4ae0d0; }
  /* Lien pas encore utilisable : partenaire enterré sous un autre canon */
  .rope-blocked .rope-line { stroke:#5a5c68 !important; stroke-dasharray:2 4; opacity:.55; }
  .rope-blocked .rope-shadow { opacity:.3; }
  .cannon.wall-cn {
    position:relative;
    padding:0; min-width:0; border-radius:6px; box-sizing:border-box;
    width:100%; height:100%; justify-content:center;
  }
  .cannon.wall-cn .cannon-barrel { width:74%; height:74%; border-radius:5px; }
  .cannon-barrel.cannon-unknown {
    background:#8b8b8b;
    border:2px solid #5d5d5d;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cannon-question {
    color:#f2f2f2;
    font-weight:900;
    font-size:clamp(16px, 2.2vw, 26px);
    line-height:1;
    text-shadow:1px 1px 0 #555;
  }

  .cannon.buried {
    pointer-events:none; transform:scale(.92); cursor:default;
  }
  .cannon.accessible { border-color:rgba(255,255,255,.25); }
  .cannon.accessible:hover { transform:translateY(-3px); border-color:var(--accent); }
  /* Un canon lié peut être le 3e canon d'un combo :
     le lien reste intact et les deux canons partent ensemble. */
  .cannon {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 12px; border-radius:10px; background:var(--surface);
    cursor:pointer; transition:all 120ms ease;
    border:2px solid transparent; box-shadow:0 3px 8px rgba(0,0,0,.3);
    user-select:none; min-width:50px;
  }
  .cannon:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.15); box-shadow:0 6px 14px rgba(0,0,0,.5); }
  .cannon:active { transform:translateY(0); }
  .cannon.disabled { opacity:.3; pointer-events:none; }
  .cannon.reserve { opacity:.75; transform:scale(.9); }
  .cannon.reserve2 { opacity:.5; transform:scale(.82); }
  .cannon.reserve:hover { opacity:1; transform:scale(.95) translateY(-2px); }

  .cannon-slot {
    min-width:54px; min-height:64px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    border:2px dashed rgba(255,255,255,.07);
  }

  .main-row   { border-bottom:1px solid rgba(255,255,255,.06); padding-bottom:6px; margin-bottom:4px; }
  .reserve-row { opacity:.85; }
  .reserve2-row { opacity:.7; }

  /* pas de highlight ligne courante */

  .cannon-barrel { width:26px; height:26px; border-radius:6px; position:relative; }
  .cannon-barrel.bW  { background:var(--col-W); }
  .cannon-barrel.bDB { background:var(--col-DB); }
  .cannon-barrel.bLB { background:var(--col-LB); }
  .cannon-barrel.bP  { background:var(--col-P); }
  .cannon-barrel.bK  { background:var(--col-K); }
  .cannon-barrel::after {
    content:''; position:absolute; inset:2px; border-radius:4px;
    background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 60%);
  }
  .cannon-ammo { font-family:'Fredoka',sans-serif; font-size:.8rem; font-weight:700; }

  .bottom-row { display:none; }
  .status { font-size:.7rem; color:var(--muted); flex:1; }
  .status.error { color:var(--danger); }
  .status.ok { color:var(--success); }
  .status.warn { color:var(--danger); font-weight:600; }
  .level-btn {
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:600;
    padding:4px 10px; border-radius:8px; border:none; cursor:pointer;
    background:var(--surface); color:var(--muted);
    transition:all 120ms;
  }
  .level-btn.active { background:var(--accent); color:#fff; }
  .level-btn:hover { color:var(--text); }
  .reset-btn {
    font-size:.65rem; font-weight:600;
    padding:4px 12px; border-radius:6px; border:none;
    color:var(--muted); background:var(--surface); cursor:pointer;
  }
  .reset-btn:hover { color:var(--text); }

  .overlay {
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.8); backdrop-filter:blur(8px); place-items:center;
  }
  .overlay.show { display:grid; }
  .ocard {
    background:var(--panel); border-radius:20px; padding:28px 32px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.7);
    animation:oPop 500ms cubic-bezier(.34,1.56,.64,1) both;
    max-width:300px;
  }
  @keyframes oPop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .ocard h2 { font-family:'Fredoka',sans-serif; font-size:1.6rem; margin-bottom:6px; }
  .ocard h2.go { color:var(--danger); }
  .ocard h2.win {
    background:linear-gradient(135deg,#28AADC,#F0AAB4,#ff6b4a);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .ocard p { color:var(--muted); margin-bottom:12px; font-size:.9rem; }
  .ocard button {
    font-family:'Fredoka',sans-serif; font-size:.9rem; font-weight:700;
    padding:8px 22px; border-radius:10px; border:none; color:white;
    background:linear-gradient(135deg,var(--accent),#e0452f); cursor:pointer;
  }

  /* ── Sélecteur de niveaux (mode Libre) ─────────────────────────────── */
  .lvcard {
    background:var(--panel); border-radius:20px; padding:22px 24px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.7);
    animation:oPop 400ms cubic-bezier(.34,1.56,.64,1) both;
    max-width:340px; width:90%;
  }
  .lvcard h2 { font-family:'Fredoka',sans-serif; font-size:1.3rem; margin-bottom:14px; }
  .lv-mode-row { display:flex; gap:8px; margin-bottom:16px; }
  .lv-mode-btn {
    flex:1; font-family:'Fredoka',sans-serif; font-size:.75rem; font-weight:700;
    padding:8px 6px; border-radius:10px; border:2px solid rgba(255,255,255,.08);
    background:var(--surface); color:var(--muted); cursor:pointer; transition:all 120ms;
  }
  .lv-mode-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .lv-list { display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .lv-tier-row { display:flex; gap:6px; margin-bottom:10px; }
  .lv-tier-btn {
    flex:1; padding:8px 4px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
    background:var(--surface); color:var(--muted); font-size:.72rem; font-weight:700; cursor:pointer;
  }
  .lv-tier-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .lv-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; border-radius:12px; background:var(--surface);
    border:2px solid rgba(255,255,255,.06); cursor:pointer; transition:all 120ms;
    text-align:left;
  }
  .lv-item:hover { border-color:var(--accent); }
  .lv-item .lv-name { font-family:'Fredoka',sans-serif; font-weight:700; font-size:.9rem; }
  .lv-item .lv-idx { color:var(--muted); font-size:.7rem; }
  .lv-close-btn {
    margin-top:16px; font-family:'Fredoka',sans-serif; font-size:.8rem; font-weight:700;
    padding:8px 20px; border-radius:10px; border:none; color:var(--muted);
    background:var(--surface); cursor:pointer;
  }
  .lv-close-btn:hover { color:var(--text); }
  .lv-restart-adv-btn {
    margin-top:10px; font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:600;
    padding:8px 14px; border-radius:10px; border:1px solid rgba(224,87,74,.4); color:var(--danger, #e0574a);
    background:transparent; cursor:pointer;
  }
  .lv-restart-adv-btn:hover { background:rgba(224,87,74,.12); }

  /* Le sélecteur de niveaux (choix / parcours / liste) n'est pas une
     fenêtre flottante par-dessus le jeu : c'est un écran plein page,
     comme un vrai menu du jeu. */
  #levelSelectOverlay {
    background: var(--bg); backdrop-filter: none;
  }
  #levelSelectOverlay.show {
    display: flex !important; /* remplace le display:grid de .overlay.show : avec
      grid, la ligne implicite "auto" ne s'étire pas de façon fiable partout,
      même avec align-items:stretch. En flex column, .lvcard récupère
      height:100% d'un parent à hauteur DÉFINIE (position:fixed;inset:0),
      sans ambiguïté — c'est ça qui manquait pour que .lv-list puisse
      vraiment scroller jusqu'aux derniers niveaux. */
  }
  #levelSelectOverlay .lvcard {
    background: var(--bg); box-shadow: none; border-radius: 0;
    width: 100%; height: 100%; max-width: 520px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    animation: oFade 250ms ease both;
  }
  @keyframes oFade { from { opacity:0; } to { opacity:1; } }

  /* ── Vues du sélecteur (choix / parcours / liste) ──────────────────── */
  .lv-view { display:flex; flex-direction:column; flex:1; min-height:0; }
  .lv-back-btn {
    align-self:flex-start; font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:600;
    color:var(--muted); background:none; border:none; cursor:pointer; margin-bottom:4px; padding:2px 0;
  }
  .lv-back-btn:hover { color:var(--text); }

  .mode-choice-row { display:flex; flex-direction:column; gap:12px; margin-bottom:4px; }
  .mode-choice-btn {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:'Fredoka',sans-serif; padding:16px 12px; border-radius:14px;
    border:2px solid rgba(255,255,255,.08); background:var(--surface); color:var(--text);
    cursor:pointer; transition:all 150ms;
  }
  .mode-choice-btn:hover { border-color:var(--accent); transform:translateY(-2px); }
  .mc-emoji { font-size:1.8rem; line-height:1; }
  .mc-label { font-size:1rem; font-weight:700; }
  .mc-desc { font-size:.68rem; color:var(--muted); }

  /* Parcours Aventure : chemin vertical de niveaux */
  .path-wrap {
    position:relative; display:flex; flex-direction:column; align-items:center;
    gap:20px; flex:1; min-height:0; overflow-y:auto; padding:18px 10px; margin-bottom:14px;
  }
  .path-wrap::before {
    content:''; position:absolute; top:8px; bottom:8px; left:50%;
    width:4px; background:rgba(255,255,255,.08); transform:translateX(-50%);
    border-radius:2px; z-index:0;
  }
  .path-node { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .path-node-circle {
    width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.05rem; color:#fff;
    background:var(--surface); border:3px solid rgba(255,255,255,.08); transition:all 150ms;
  }
  .path-node.locked .path-node-circle { color:var(--muted); opacity:.5; }
  .path-node.done .path-node-circle {
    background:linear-gradient(135deg,#b23fd0,#7b2ff0); border-color:#c463e6;
    box-shadow:0 0 14px rgba(178,63,208,.45);
  }
  .path-node.current .path-node-circle {
    width:66px; height:66px; font-size:1.3rem; cursor:pointer;
    background:linear-gradient(135deg,#2fb6f0,#1a7fe0); border-color:#7fd4ff;
    box-shadow:0 0 0 6px rgba(47,182,240,.18), 0 0 18px rgba(47,182,240,.6);
    animation:pathPulse 1600ms ease-in-out infinite;
  }
  @keyframes pathPulse {
    0%,100% { box-shadow:0 0 0 6px rgba(47,182,240,.18), 0 0 18px rgba(47,182,240,.6); }
    50%     { box-shadow:0 0 0 10px rgba(47,182,240,.1), 0 0 26px rgba(47,182,240,.8); }
  }
  .path-node-tier {
    font-family:'Fredoka',sans-serif; font-size:.62rem; font-weight:700; padding:2px 10px;
    border-radius:8px; color:var(--muted); background:var(--surface);
  }
  .path-node.current .path-node-tier { color:#fff; background:#1a7fe0; }
  .path-node.done .path-node-tier { color:#fff; background:#7b2ff0; }

  .lv-play-btn {
    font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:700;
    padding:12px 28px; border-radius:12px; border:none; color:#fff; width:100%;
    background:linear-gradient(135deg,#ffce45,#ff9d1e); cursor:pointer;
    box-shadow:0 6px 18px rgba(255,157,30,.4);
  }
  .mode-toggle-btn {
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:600;
    padding:4px 10px; border-radius:8px; border:none; cursor:pointer;
    background:var(--surface); color:var(--muted); transition:all 120ms;
  }
  .mode-toggle-btn:hover { color:var(--text); }

  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
  }
  .shake { animation:shake 350ms ease; }
</style>
</head>

<div class="app">
  <div class="header">
    <h1 id="levelTitle">Pixel Cannon</h1>
    <div class="stats">
      <div>Tirs:<b id="sShots">0</b></div>
      <div><span class="hl" id="sProg">0%</span></div>
    </div>

  <div style="display:flex;gap:6px;padding:0 14px 6px;flex-shrink:0;">

    <button class="level-btn peek-btn" id="peekBtn" title="Révéler / cacher le modèle">👁 Aperçu</button>
    <button class="mode-toggle-btn" id="lvSelectBtn" title="Choisir un niveau">🗺 Niveaux</button>

    <div class="grid-outer" id="gridOuter">

  </div>

      <div class="fire-label">Tir</div>

      </div>
      <div class="wz-count-badge" id="beltCount">0/5</div>
    </div>
    <div class="cannons-box" id="cannonsBox"></div>
    <div class="bonus-row" id="bonusRow">

      </button>
    </div>
    <div class="bottom-row">
      <div class="status" id="status"></div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<div class="overlay" id="goOverlay">
  <div class="ocard">
    <h2 class="go">Game Over !</h2>
    <p id="goMsg">Chemin bloqué !</p>
    <button onclick="retryStage()">Réessayer</button>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="ocard">
    <h2 class="win">Bravo !<br>Niveau terminé !</h2>
    <button onclick="nextStage()">Prochain niveau ➜</button>
  </div>
</div>

<div class="overlay" id="levelSelectOverlay">
  <div class="lvcard" id="lvCard">

    <!-- Prototype : Aventure uniquement -->
    <div class="lv-view" id="lvViewAdventure">

      <div class="path-wrap" id="pathWrap"></div>
      <button class="lv-play-btn" id="lvPlayBtn">▶ Jouer</button>
      <button class="lv-restart-adv-btn" id="lvRestartAdvBtn">↺ Recommencer l'aventure</button>
    </div>

    <button class="lv-close-btn" id="lvCloseBtn">Fermer</button>
  </div>
</div>

        ['K','K','K','K','K','K','K','K','K','K','K','SK2','SK2','SK2','SK2','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K'],
        ['K','K','K','K','K','K','K','K','K','K','K','K','SK2','SK2','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K'],
        ['K','K','K','K','K','K','K','K','K','K','K','K','SK2','SK2','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K'],
        ['K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K','K'],      ]
    },

  ];

  // ── PARCOURS AVENTURE DU PROTOTYPE ───────────────────────────────────────
  // Les dessins eux-mêmes restent inchangés dans LEVELS ; seul leur ordre
  // dans l'Aventure est défini ici.
  const ADVENTURE_ORDER = [
    'Ourson',
    'La Jeune Fille a la perle',
    'Chemin doré',
    'Pancakes',
    'Abduction',
    'Montagne',
    'Sunset'
  ];
  const ADVENTURE_LINKED_LEVELS = ['Chemin doré', 'Pancakes'];
  const ADVENTURE_MAX_STAGE = ADVENTURE_ORDER.length;

  function adventureLevelIndex(stg) {
    const name = ADVENTURE_ORDER[Math.max(0, Math.min(ADVENTURE_MAX_STAGE - 1, stg - 1))];
    const idx = LEVELS.findIndex(lv => lv.name === name);
    return idx >= 0 ? idx : 0;
  }

  let currentLevel = 0;
  let T, CI, CK, GC;

  function loadLevel(idx) {
    currentLevel = idx;
    const lv = LEVELS[idx];
    T  = lv.grid;
    CI = lv.colors;
    CK = Object.keys(CI);
    NR = T.length;
    NC = T[0].length;
    gridEl.style.gridTemplateColumns = `repeat(${NC}, var(--cell))`;
    if (typeof fitGrid === 'function') fitGrid();

    // Build GC (grid cell class map) and inject CSS vars for colors
    GC = {};
    for (const key of CK) {
      GC[key] = 'g' + key;
    }
    injectColorCSS(CI);
  }

  function injectColorCSS(colors) {
    let existing = document.getElementById('dynamic-colors');
    if (!existing) {
      existing = document.createElement('style');
      existing.id = 'dynamic-colors';
      document.head.appendChild(existing);
    }
    let css = '';
    for (const [key, def] of Object.entries(colors)) {
      const hex = def.hex;
      css += `
        .g${key}   { background: ${hex}22; }
        .b${key}   { background: ${hex}; }
        .c${key}   { background: linear-gradient(145deg, ${lighten(hex)}, ${hex} 50%, ${darken(hex)}); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.2); }
        :root      { --col-${key}: ${hex}; }
      `;
    }
    existing.textContent = css;
  }

  function lighten(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgb(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+40)})`;
  }
  function darken(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`;
  }
  // ── END LEVELS ───────────────────────────────────────────────────────────

  // Accessibility from 4 edges
  function canFromBot(r,c){for(let i=NR-1;i>r;i--)if(placed[i][c])return false;return true;}
  function canFromTop(r,c){for(let i=0;i<r;i++)if(placed[i][c])return false;return true;}
  function canFromLeft(r,c){for(let i=0;i<c;i++)if(placed[r][i])return false;return true;}
  function canFromRight(r,c){for(let i=NC-1;i>c;i--)if(placed[r][i])return false;return true;}
  function isOK(r,c){return canFromBot(r,c)||canFromTop(r,c)||canFromLeft(r,c)||canFromRight(r,c);}
  function findBlocked(){
    for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)
      if(!placed[r][c]&&!isOK(r,c))return{r,c};
    return null;
  }

  function buildFirePlan(color){
    const plan=[];
    for(let r=0;r<NR;r++)for(let c=0;c<NC;c++)
      if(T[r][c]===color&&!placed[r][c])plan.push({r,c});
    return plan;
  }

  function buildCannons(){
    const tot = {};
    for (const k of CK) tot[k] = 0;
    for(let r=0;r<NR;r++)for(let c=0;c<NC;c++) if(tot[T[r][c]]!==undefined) tot[T[r][c]]++;
    const arr=[];let id=0;
    for(const k of CK){
      const t=tot[k];if(t<=0)continue;
      const f=Math.floor(t/MAX_SHOTS),d=t%MAX_SHOTS;
      for(let i=0;i<f;i++)arr.push({id:id++,color:k,max:MAX_SHOTS,rem:MAX_SHOTS,inZone:false,done:false,firing:false});
      if(d>0)arr.push({id:id++,color:k,max:d,rem:d,inZone:false,done:false,firing:false});
    }
    const piles={};
    for(const cn of arr){if(!piles[cn.color])piles[cn.color]=[];piles[cn.color].push(cn);}
    for(const k of CK)if(piles[k])shuf(piles[k]);
    const res=[];let s=arr.length+10;
    while(res.length<arr.length&&s-->0)for(const k of CK)if(piles[k]&&piles[k].length)res.push(piles[k].shift());
    return res;
  }
  function shuf(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}}

  // ── RNG seedé : même niveau + mêmes réglages = TOUJOURS le même mur.
  // On mémorise le mur pour pouvoir le rejouer identique à chaque tentative,
  // comme dans un jeu de solitaire classique où on apprend le chemin.
  function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ── STATE ───────────────────────────────────────────────────────────────
  // ── STATE ────────────────────────────────────────────────────────────────
  let placed, shots, gameOver;
  let currentRow = 0;       // ligne courante du pixel art
  let mainLine   = [];      // 5 slots max — canons actifs (ligne principale)
  let wall = [];            // mur de canons : grille à trous, hauteur fixe
  let colStacks = [];       // une pile cachée PAR COLONNE : recharge par le bas
  let lastTriples = [];     // triples du dernier tirage (pour l'arrangement facile)
  let beltCannons = [];     // canons sur le tapis (max 5)

  const BASE_BELT = 5;
  const MAX_EXTRA_SLOTS = 2;      // nb max de fois où le bonus "+1 case" peut agrandir le tapis
  const MAX_BELT = BASE_BELT + MAX_EXTRA_SLOTS;

  // ── BONUS ────────────────────────────────────────────────────────────────
  let extraSlots = 0;             // cases supplémentaires débloquées ce niveau
  let wildArmed  = false;         // bonus "n'importe quel canon" activé, prêt à l'emploi
  const BONUS_START = { shuffle: 2, slot: 2, wild: 2 };
  let bonusCharges = { ...BONUS_START };

  const $ = id => document.getElementById(id);
  const gridEl = $('grid'),
        sS = $('sShots'), sP = $('sProg'),
        wO = $('winOverlay'), wS = $('winShots'),
        gOv = $('goOverlay'), gM = $('goMsg'),
        rB = $('railBorder'), stEl = $('status');

  // ── FIRE ZONE ─────────────────────────────────────────────────────────────
  const FIRE_COOLDOWN = 10;
  const fireZoneEl = $('fireZone');

  const fireSlots = Array.from({length: MAX_BELT}, (_, i) => {
    const el = document.createElement('div');
    el.className = 'fire-slot';
    el.dataset.slot = i;
    fireZoneEl.appendChild(el);
    const slot = { el, cannon: null, timer: null, firing: false, idx: i };
    return slot;
  });

  function getFreeSlot() {
    return fireSlots.find((s, i) => i < tapisCap() && !s.cannon && !s.reserved);
  }

  // Réserve deux cases VOISINES pour un duo de canons liés, afin que la
  // corde qui les relie ne passe jamais au-dessus d'un canon sans rapport.
  // Si aucune paire de cases voisines n'est libre en l'état (le tapis
  // contient des "trous" issus d'un combo ou d'un canon parti plus tôt),
  // on regroupe d'abord les canons AU REPOS (ni en train de tirer, ni
  // réservés pour une arrivée en cours) vers la gauche : ça condense les
  // cases libres en un seul bloc, sans jamais déplacer un canon dont
  // l'animation est en cours.
  function reserveAdjacentPairSlots() {
    const cap = tapisCap();
    const isFree = i => fireSlots[i] && !fireSlots[i].cannon && !fireSlots[i].reserved;
    const findPair = () => {
      for (let i = 0; i < cap - 1; i++) {
        if (isFree(i) && isFree(i + 1)) return [fireSlots[i], fireSlots[i + 1]];
      }
      return null;
    };

    let pair = findPair();
    if (pair) return pair;

    const movableIdx = [];
    for (let i = 0; i < cap; i++) {
      const s = fireSlots[i];
      if (s.reserved || (s.cannon && s.firing)) continue; // jamais déplacé
      movableIdx.push(i);
    }
    const cannonsInOrder = movableIdx.filter(i => fireSlots[i].cannon).map(i => fireSlots[i].cannon);
    let k = 0;
    const touched = [];
    for (const i of movableIdx) {
      const s = fireSlots[i];
      const next = k < cannonsInOrder.length ? cannonsInOrder[k++] : null;
      if (s.cannon !== next) { s.cannon = next; touched.push(s); }
    }
    for (const s of touched) renderSlot(s);

    return findPair();
  }

  function sendToFireZone(cn, slotOpt) {
    if (gameOver) return;
    const slot = slotOpt || getFreeSlot();
    if (!slot) { setSt('Tapis plein !', 'warn'); return; }
    cn.inZone = true;
    slot.cannon = cn;
    beltCannons.push(cn);
    renderSlot(slot);
    updateBeltCount();
    renderCannonLines();

    // Pas de tir individuel : seul un combo de 3 identiques déclenche le tir
    checkFusion(cn.color);
    checkDeadlock();
  }

  // Game Over si le tapis est plein, qu'aucun combo n'est possible
  // et qu'aucun combo n'est en train de se vider
  function checkDeadlock() {
    if (gameOver) return;
    const occ = fireSlots.filter(s => s.cannon);
    if (occ.length < tapisCap()) return;
    if (occ.some(s => s.firing)) return; // un combo se vide, de la place arrive
    const counts = {};
    for (const s of occ) counts[s.cannon.color] = (counts[s.cannon.color] || 0) + 1;
    if (Object.values(counts).some(v => v >= 3)) return;
    trigGameOver('Tapis plein — aucun combo possible !');
  }

  // Couleurs actuellement en état fusionné dans la zone de tir
  const fusedColors = new Set();

  function checkFusion(color) {
    // Un combo = 3 canons EN ATTENTE de la même couleur.
    // Un canon en train de tirer ne compte pas : sinon il "volerait" un canon
    // au triple suivant et laisserait des orphelins impossibles à jouer en fin de partie.
    const sameSlots = fireSlots.filter(s => s.cannon && !s.firing && s.cannon.color === color && !s.cannon.done);
    if (sameSlots.length < 3) return;

    const keepSlot = sameSlots[0];
    const keepCannon = keepSlot.cannon;
    const totalRem = sameSlots.reduce((sum, s) => sum + s.cannon.rem, 0);

    for (const s of sameSlots.slice(1)) {
      if (s.timer) { clearTimeout(s.timer); s.timer = null; }
      const c = s.cannon;
      c.inZone = false; c.done = true;
      const idx = beltCannons.indexOf(c);
      if (idx !== -1) beltCannons.splice(idx, 1);
      firePlanMap.delete(c.id);
      s.cannon = null;
      s.el.className = 'fire-slot';
      s.el.innerHTML = '';
    }

    keepCannon.rem = totalRem;
    firePlanMap.set(keepCannon.id, makePlanAll(keepCannon));
    keepSlot.el.classList.add('fusion');
    setTimeout(() => keepSlot.el.classList.remove('fusion'), 400);
    keepSlot.firing = true;
    renderSlot(keepSlot);
    updateBeltCount();
    renderCannonLines();
    setSt('Combo ' + CI[color].n + ' ! ' + totalRem + ' cases', 'ok');
    scheduleFire(keepSlot);
  }

  function renderSlot(slot) {
    const cn = slot.cannon;
    const locked = !cn && slot.idx >= tapisCap();
    if (!cn) {
      slot.el.className = 'fire-slot' + (locked ? ' locked' : '');
      slot.el.innerHTML = '';
    } else {
      slot.el.className = 'fire-slot occupied' + (slot.firing ? ' firing' : '');
      slot.el.innerHTML = slot.firing
        ? `<div class="fs-dot ${CI[cn.color].b}"></div><div class="fs-count">${cn.rem}</div>`
        : `<div class="fs-dot ${CI[cn.color].b}"></div>`;
    }
    drawFireRopes();
  }

  // Dessine, dans le tapis (zone de tir), la même corde que celle utilisée
  // sur le mur (drawLinkRopes) entre deux canons liés une fois que le duo a
  // été entraîné ensemble.
  let fireRopeSvg = null;
  function drawFireRopes() {
    if (fireRopeSvg) { fireRopeSvg.remove(); fireRopeSvg = null; }
    const seen = new Set();
    const pairs = [];
    for (let i = 0; i < fireSlots.length; i++) {
      const cn = fireSlots[i].cannon;
      if (!cn || cn.linkId == null || cn.done || seen.has(cn.linkId)) continue;
      for (let j = 0; j < fireSlots.length; j++) {
        if (j === i) continue;
        const cn2 = fireSlots[j].cannon;
        if (cn2 && !cn2.done && cn2.linkId === cn.linkId) {
          pairs.push([i, j, cn.linkId]);
          seen.add(cn.linkId);
          break;
        }
      }
    }
    if (!pairs.length) return;
    const zoneRect = fireZoneEl.getBoundingClientRect();
    if (!zoneRect.width || !zoneRect.height) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'link-rope-layer');
    svg.setAttribute('width', zoneRect.width);
    svg.setAttribute('height', zoneRect.height);
    for (const [i, j, linkId] of pairs) {
      const ra = fireSlots[i].el.getBoundingClientRect();
      const rb = fireSlots[j].el.getBoundingClientRect();
      const x1 = ra.left - zoneRect.left + ra.width / 2, y1 = ra.top - zoneRect.top + ra.height / 2;
      const x2 = rb.left - zoneRect.left + rb.width / 2, y2 = rb.top - zoneRect.top + rb.height / 2;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'rope link-' + (linkId % 6));
      const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      shadow.setAttribute('x1', x1); shadow.setAttribute('y1', y1 + 1.5);
      shadow.setAttribute('x2', x2); shadow.setAttribute('y2', y2 + 1.5);
      shadow.setAttribute('class', 'rope-shadow');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'rope-line');
      g.appendChild(shadow);
      g.appendChild(line);
      svg.appendChild(g);
    }
    fireZoneEl.appendChild(svg);
    fireRopeSvg = svg;
  }

  function updateSlotLocks() {
    for (const s of fireSlots) if (!s.cannon) renderSlot(s);
  }

  function scheduleFire(slot) {
    if (slot.timer) clearTimeout(slot.timer);
    slot.timer = setTimeout(() => doFire(slot), Math.max(FIRE_COOLDOWN, 16));
  }

  function doFire(slot) {
    slot.timer = null;
    const cn = slot.cannon;
    if (!cn || gameOver) return;

    const plan = firePlanMap.get(cn.id);
    if (!plan) { removeFromFireZone(slot); return; }

    // Cadence : sous 16 ms de cooldown, on groupe plusieurs tirs dans une
    // même frame — un timer + une animation par pixel ferait ramer le jeu
    const batch = FIRE_COOLDOWN >= 16 ? 1 : Math.max(1, Math.round(16 / Math.max(FIRE_COOLDOWN, 2)));

    let last = null;
    for (let i = 0; i < batch && !cn.done; i++) {
      while (plan.length && placed[plan[0].r][plan[0].c]) plan.shift();
      if (!plan.length) break;
      const target = plan.shift();
      cn.rem--;
      shots++;
      if (cn.rem <= 0) cn.done = true;
      placed[target.r][target.c] = true;
      placedCount++;
      placeCell(target.r, target.c);
      last = target;
    }
    while (plan.length && placed[plan[0].r][plan[0].c]) plan.shift();

    if (last) {
      const fsCount = slot.el.querySelector('.fs-count');
      if (fsCount) fsCount.textContent = cn.rem;

      // Une seule animation de vol par passe (vers la dernière case posée)
      const cellEl = gridEl.children[last.r * NC + last.c];
      if (slot.el && cellEl) {
        const cr = slot.el.getBoundingClientRect();
        const gr = cellEl.getBoundingClientRect();
        const sx = cr.left + cr.width/2 - 4, sy = cr.top + cr.height/2 - 4;
        const px = document.createElement('div');
        px.className = 'fly-pixel';
        px.style.cssText = `left:${sx}px;top:${sy}px;background:var(--col-${cn.color});--dx:${(gr.left+gr.width/2-4)-sx}px;--dy:${(gr.top+gr.height/2-4)-sy}px;`;
        document.body.appendChild(px);
        setTimeout(() => px.remove(), 300);
      }

      updStats();
      playPop();
      vibrateTap();
    }

    // Victoire ?
    const {d, t} = prog();
    if (d === t) {
      setTimeout(() => {
        const fwDuration = 1200;
        launchFireworks(fwDuration);
        // On attend que les fusées + explosions aient fini de s'estomper
        // (durée des bursts + montée de la fusée + vie des particules)
        setTimeout(() => { if (wS) wS.textContent = shots; wO.classList.add('show'); }, fwDuration + 1700);
      }, 400);
      return;
    }

    // Canon vide ou couleur terminée ?
    if (cn.done || !plan.length) {
      removeFromFireZone(slot);
      return;
    }

    scheduleFire(slot);
  }

  function removeFromFireZone(slot) {
    if (slot.timer) { clearTimeout(slot.timer); slot.timer = null; }
    const cn = slot.cannon;
    if (!cn) return;
    // Si c'était le dernier canon fusionné de cette couleur, réinitialiser
    const remainingSame = fireSlots.filter(s => s !== slot && s.cannon && s.cannon.color === cn.color);
    if (remainingSame.length === 0) fusedColors.delete(cn.color);
    cn.inZone = false; cn.done = true;
    const idx = beltCannons.indexOf(cn);
    if (idx !== -1) beltCannons.splice(idx, 1);
    firePlanMap.delete(cn.id);
    slot.cannon = null;
    slot.firing = false;
    renderSlot(slot);
    updateBeltCount();
    renderCannonLines();
  }

  function advanceRow() {
    const next = firstNonWhiteRow(currentRow - 1);
    if (next === -1) return;
    currentRow = next;
    setSt(fillDir === 'up' ? 'Le dessin monte du bas vers le haut !' : 'Le dessin descend du haut vers le bas !', 'ok');
    // Les setInterval continuent — ils verront la nouvelle currentRow au prochain tick
  }

  // Watchdog : toutes les 300ms, si la ligne courante est déjà complète, avancer
  // Couvre le cas où tous les canons en zone de tir ont une autre couleur
  function startWatchdog() {
    if (window._watchdog) clearInterval(window._watchdog);
    window._watchdog = setInterval(() => {
      if (gameOver) { clearInterval(window._watchdog); return; }
      if (isRowComplete(currentRow)) {
        advanceRow();
      }
    }, 300);
  }


  function stopAllFire() {
    for (const s of fireSlots) {
      if (s.timer) { clearTimeout(s.timer); s.timer = null; }
      s.firing = false;
    }
  }

  function updateBeltCount() {
    const badge = document.getElementById('beltCount');
    if (!badge) return;
    const n = beltCannons.length;
    badge.textContent = n + '/' + tapisCap();
    badge.classList.toggle('danger', n >= 4);
  }

  // ── GAME OVER ─────────────────────────────────────────────────────────────

  function trigGameOver(msg) {
    gameOver = true;
    gM.textContent = msg;
    gOv.classList.add('show');
    renderCannonLines();
    updateBonusUI();
  }

  // ── RENDER ────────────────────────────────────────────────────────────────

  // Pixels non-blancs de la ligne r
  function rowPixels(r) {
    const out = [];
    for (let c = 0; c < NC; c++)
      if (CI[T[r][c]]) out.push({r, c, color: T[r][c]});
    return out;
  }

  // Trouver la première ligne non-entièrement-blanche (en partant du bas)
  function firstNonWhiteRow(startR) {
    for (let r = startR; r >= 0; r--)
      if (rowPixels(r).length > 0) return r;
    return -1; // fin du dessin
  }

  // Vérifier si la ligne r est complètement placée (hors blancs)
  function isRowComplete(r) {
    return rowPixels(r).every(p => placed[p.r][p.c]);
  }

  // Construire un canon {id, color, rem}
  let _nextId = 0;
  function makeCannon(color, rem) {
    return { id: _nextId++, color, rem, inZone: false, done: false };
  }

  // Construire tous les canons pour le pixel art (en ignorant blanc)
  // Retourne tableau plat trié par couleur / 10 tirs max
  // Construit la pile de canons pour la mécanique combo :
  // - chaque couleur est découpée en canons à charges VARIABLES
  // - le nombre de canons par couleur est un multiple de 3 (combos complets)
  // - la somme des charges = le nombre exact de cases de la couleur
  // - les triples sont ordonnés selon la profondeur du dessin (bas → haut)
  //   et entrelacés deux par deux : toujours solvable avec 5 slots
  function buildOrderedPile() {
    const avg = LEVELS[currentLevel].maxShots || MAX_SHOTS;

    // 1) Pixels par couleur + lignes de chaque pixel (triées bas → haut)
    const totals = {}, rowsByColor = {};
    for (const k of CK) { totals[k] = 0; rowsByColor[k] = []; }
    const rowOrder = fillDir === 'up'
      ? Array.from({length: NR}, (_, i) => NR - 1 - i)
      : Array.from({length: NR}, (_, i) => i);
    for (const r of rowOrder)
      for (let c = 0; c < NC; c++) {
        const col = T[r][c];
        if (!CI[col]) continue; // case vide (fond transparent, pas une couleur du dessin)
        totals[col]++; rowsByColor[col].push(r);
      }

    // 2) Découper chaque couleur en triples de canons
    const triples = [];
    for (const k of CK) {
      const P = totals[k];
      if (!P) continue;
      // Charges rondes : uniquement 25 ou 50.
      // On couvre P avec le minimum de canons (multiple de 3) ; le léger
      // surplus est ignoré une fois toutes les cases de la couleur posées.
      // En DIFFICILE, on n'utilise que des 25 : deux fois plus de canons,
      // donc un mur toujours large mais avec plus de couches à traverser.
      const unit = effectiveTier() === 'difficile' ? 25 : 50;
      const nTri = Math.max(1, Math.ceil(Math.ceil(P / unit) / 3));
      const K = 3 * nTri;
      const c50 = unit === 25 ? 0 : Math.max(0, Math.min(K, Math.ceil((P - 25 * K) / 25)));
      const sizes = Array.from({length: K}, (_, i) => (i < c50 ? 50 : 25));
      shuf(sizes);
      // Profondeur de chaque triple = ligne du dernier pixel qu'il couvre
      let covered = 0;
      for (let i = 0; i < nTri; i++) {
        const cs = [makeCannon(k, sizes[3*i]), makeCannon(k, sizes[3*i+1]), makeCannon(k, sizes[3*i+2])];
        shuf(cs);
        covered += sizes[3*i] + sizes[3*i+1] + sizes[3*i+2];
        const depth = rowsByColor[k][Math.min(covered, P) - 1];
        triples.push({ depth, cannons: cs });
      }
    }

    // 3) Trier : les triples nécessaires en premier selon la direction
    triples.sort((a, b) => fillDir === 'up' ? b.depth - a.depth : a.depth - b.depth);
    lastTriples = triples.map(t => t.cannons.slice());

    // 4) Mélange fenêtré + validation par solveur :
    //    on brasse les canons de 3-4 triples voisins pour casser la linéarité,
    //    puis on vérifie qu'une partie bien jouée reste gagnable. Sinon,
    //    on remélange (en réduisant le désordre si besoin).
    // L'ordre de base : triples entrelacés deux par deux.
    // La difficulté ne vient plus de la file mais de l'ARRANGEMENT DU MUR.
    const pile = [];
    for (let i = 0; i < triples.length; i += 2) {
      const A = triples[i].cannons.slice();
      const B = triples[i + 1] ? triples[i + 1].cannons.slice() : [];
      while (A.length || B.length) {
        const pool = [];
        if (A.length) pool.push(A);
        if (B.length) pool.push(B);
        pile.push(pool[0 | Math.random() * pool.length].shift());
      }
    }
    return pile;
  }

  // Remplir les lignes principale et réserve depuis la pile cachée
  // Montée en cascade : quand le slot i de la ligne principale se vide,
  // le canon au même index i de la réserve monte automatiquement,
  // et la réserve se remplit depuis la pile cachée.
  // ── MUR DE CANONS (grille à positions fixes) ────────────────────────────
  // Les canons ne bougent pas : prendre un canon laisse un TROU. Un canon est
  // jouable s'il existe un chemin de cases vides (qui peut serpenter) entre
  // lui et le HAUT du mur. Le canon parcourt ce chemin sous tes yeux.
  // Le mur affiche toujours WALL_ROWS rangées : le reste attend en réserve
  // et recharge une colonne dès qu'elle est entièrement vidée.
  const WALL_ROWS = 3;
  const WALL_COLS = 5;
  function wallCols(count) {
    return WALL_COLS; // base fixe : 5 colonnes, quel que soit le nombre de canons
  }

  // Grille rows×cols remplie ligne par ligne ; reliquat centré en bas
  function dealGrid(pile, cols) {
    const rows = Math.ceil(pile.length / cols);
    const g = Array.from({length: rows}, () => Array(cols).fill(null));
    const full = (pile.length / cols) | 0;
    let i = 0;
    for (let r = 0; r < full; r++)
      for (let c = 0; c < cols; c++) g[r][c] = pile[i++];
    const rem = pile.length - i;
    const off = ((cols - rem) / 2) | 0;
    for (let k = 0; k < rem; k++) g[rows - 1][off + k] = pile[i++];
    return g;
  }

  // Cases vides atteignables depuis le haut (BFS) → ensemble des canons libres
  function freeCells(g) {
    const rows = g.length, cols = g[0].length;
    const reach = Array.from({length: rows}, () => Array(cols).fill(false));
    const q = [];
    for (let c = 0; c < cols; c++)
      if (!g[0][c]) { reach[0][c] = true; q.push([0, c]); }
    while (q.length) {
      const [r, c] = q.pop();
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        if (g[nr][nc] || reach[nr][nc]) continue;
        reach[nr][nc] = true;
        q.push([nr, nc]);
      }
    }
    const free = Array.from({length: rows}, () => Array(cols).fill(false));
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        if (!g[r][c]) continue;
        if (r === 0) { free[r][c] = true; continue; }
        for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && reach[nr][nc]) { free[r][c] = true; break; }
        }
      }
    return free;
  }

  // Plus court chemin de sortie (cases vides, sortie par le haut) — pour l'animation
  // Un canon lié à un autre sur une rangée différente (diagonale) ne doit
  // être pris qu'une fois que les DEUX se retrouvent réellement dégagés par
  // le haut (plus aucun canon au-dessus dans leur colonne) — pas seulement
  // "atteignable par un détour" comme freeCells l'autorise pour un canon
  // seul. Tant que ce n'est pas le cas, la paire reste bloquée, même si
  // techniquement un chemin détourné existe.
  function columnClear(g, r, c) {
    for (let rr = 0; rr < r; rr++) if (g[rr][c]) return false;
    return true;
  }

  function findExitPath(g, sr, sc) {
    const rows = g.length, cols = g[0].length;
    if (sr === 0) return [[sr, sc], [-1, sc]];
    const prev = Array.from({length: rows}, () => Array(cols).fill(null));
    const q = [];
    for (const [dr, dc] of [[-1,0],[1,0],[0,1],[0,-1]]) {
      const nr = sr + dr, nc = sc + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !g[nr][nc] && !prev[nr][nc]) {
        prev[nr][nc] = [sr, sc];
        q.push([nr, nc]);
      }
    }
    let qi = 0, exitCell = null;
    while (qi < q.length) {
      const [r, c] = q[qi++];
      if (r === 0) { exitCell = [r, c]; break; }
      for (const [dr, dc] of [[-1,0],[0,1],[0,-1],[1,0]]) {
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        if (g[nr][nc] || prev[nr][nc]) continue;
        prev[nr][nc] = [r, c];
        q.push([nr, nc]);
      }
    }
    if (!exitCell) return null;
    const path = [];
    let cur = exitCell;
    while (cur && !(cur[0] === sr && cur[1] === sc)) {
      path.unshift(cur);
      cur = prev[cur[0]][cur[1]];
    }
    path.unshift([sr, sc]);
    path.push([-1, exitCell[1]]); // sortie au-dessus du mur
    return path;
  }

  // Découpe un mur complet en (grille visible, réserve) comme en jeu
  function splitWall(full) {
    const cols = full[0].length;
    const g = full.slice(0, WALL_ROWS).map(r => r.slice());
    // Chaque colonne garde SA propre pile cachée (jamais mélangée avec une autre)
    const res = Array.from({length: cols}, () => []);
    for (let r = WALL_ROWS; r < full.length; r++)
      for (let c = 0; c < cols; c++) if (full[r][c]) res[c].push(full[r][c]);
    return { g, res };
  }

  // Applique la recharge des colonnes vides (même règle qu'en jeu)
  // Même règle que settleWall() côté jeu réel : chaque colonne se tasse
  // vers le haut puis pioche dans sa réserve pour combler les trous du bas,
  // dès qu'il y a de la place (pas besoin d'attendre que la colonne soit
  // entièrement vide).
  function applyRefill(g, res) {
    const cols = g[0].length;
    for (let c = 0; c < cols; c++) {
      const items = [];
      for (let r = 0; r < g.length; r++) if (g[r][c]) items.push(g[r][c]);
      for (let r = 0; r < g.length; r++) g[r][c] = r < items.length ? items[r] : null;
      if (!res[c] || !res[c].length) continue;
      for (let r = g.length - 1; r >= 0 && res[c].length; r--) {
        if (!g[r][c]) g[r][c] = res[c].shift();
      }
    }
  }

  // Joueur "instinct" : prend toujours le canon le plus utile visible.
  function greedyWins(full) {
    const { g, res } = splitWall(full);
    const tapis = [];
    let guard = 20000;
    while (guard-- > 0) {
      let empty = true;
      for (const row of g) for (const x of row) if (x) { empty = false; break; }
      if (empty && res.every(s => !s.length)) return tapis.length === 0;
      const free = freeCells(g);
      const tc = {};
      for (const z of tapis) tc[z.color] = (tc[z.color] || 0) + 1;
      let best = null, bs = -1;
      for (let r = 0; r < g.length; r++)
        for (let c = 0; c < g[0].length; c++)
          if (free[r][c]) { const s = tc[g[r][c].color] || 0; if (s > bs) { bs = s; best = [r, c]; } }
      if (!best) return false;
      const cn = g[best[0]][best[1]];
      g[best[0]][best[1]] = null;
      applyRefill(g, res);
      tapis.push(cn);
      const same = tapis.filter(z => z.color === cn.color);
      if (same.length >= 3) for (const z of same) tapis.splice(tapis.indexOf(z), 1);
      if (tapis.length >= tapisCap()) return false;
    }
    return false;
  }

  // Recherche (réserve incluse) : existe-t-il une façon de gagner ?
  function solvableWithReserve(full) {
    const start = splitWall(full);
    const CAP = tapisCap();
    let nodes = 0;
    const seen = new Set();

    function rec(g, res, tapis) {
      if (++nodes > 40000) return false;
      let empty = true;
      for (const row of g) for (const x of row) if (x) { empty = false; break; }
      if (empty && res.every(s => !s.length)) return Object.values(tapis).every(v => !v);
      let k = '';
      for (const row of g) for (const x of row) k += x ? x.color : '.';
      k += '|' + res.map(s => s.length).join('.') + '|';
      for (const col in tapis) if (tapis[col]) k += col + tapis[col];
      if (seen.has(k)) return false;
      seen.add(k);
      const free = freeCells(g);
      const cand = [];
      for (let r = 0; r < g.length; r++)
        for (let c = 0; c < g[0].length; c++) if (free[r][c]) cand.push([r, c]);
      cand.sort((a, b) => (tapis[g[b[0]][b[1]].color] || 0) - (tapis[g[a[0]][a[1]].color] || 0));
      let n = 0;
      for (const [r, c] of cand) {
        if (++n > 6) break; // largeur limitée : garde la génération rapide
        const cn = g[r][c];
        const cur = tapis[cn.color] || 0;
        const g2 = g.map(row => row.slice());
        const res2 = res.map(s => s.slice());
        g2[r][c] = null;
        applyRefill(g2, res2);
        const t2 = Object.assign({}, tapis);
        if (cur === 2) t2[cn.color] = 0; else t2[cn.color] = cur + 1;
        let size = 0;
        for (const col in t2) size += t2[col];
        if (size >= CAP) continue;
        if (rec(g2, res2, t2)) return true;
      }
      return false;
    }
    return rec(start.g, start.res, {});
  }

  // ── PAIRES LIÉES (difficulté optionnelle, testée sur "Chemin doré") ─────
  // Deux canons de couleurs différentes sont "liés" : prendre l'un fait
  // partir l'autre avec lui automatiquement, où qu'il soit dans le mur ou
  // la réserve cachée. Même si le canon pris est le 3ème de sa couleur,
  // le lien reste intact : les deux canons vont ensemble dans la zone de tir.
  // La seule contrainte est qu'il faut assez de place pour les deux.

  // Cherche le partenaire d'un canon lié n'importe où dans g (grille pleine
  // rows×cols) ou dans les couches profondes déjà connues via cette même g.
  function findLinkedPartnerInGrid(g, linkId, exclude) {
    for (let r = 0; r < g.length; r++)
      for (let c = 0; c < g[0].length; c++) {
        const x = g[r][c];
        if (x && x !== exclude && x.linkId === linkId) return [r, c];
      }
    return null;
  }

  // Choisit des paires de canons de couleurs différentes selon DEUX familles,
  // toutes deux basées sur le MÊME motif de voisinage (droite, diagonale
  // bas-droite, diagonale bas-gauche — JAMAIS "dessous" pur : un duo n'est
  // donc jamais vertical, toujours horizontal ou diagonal) — seule la
  // position dans le mur change :
  //
  // 1) Paires VISIBLES — les deux canons voisins sont dans les WALL_ROWS
  //    premières lignes (la couche visible au lancement du niveau) : les
  //    deux moitiés du duo sont déjà côte à côte dès le dessin, corde
  //    visible immédiatement.
  //
  // 2) Paires CACHÉES — un canon caché est impliqué (frontière avec la
  //    dernière ligne visible, ou les deux canons tout à fait en
  //    profondeur). Voisinage horizontal/diagonal uniquement (jamais
  //    vertical, voir neighborsOf ci-dessous).
  //
  // `minVisible` garantit un minimum de paires du groupe 1 (visibles dès le
  // lancement), en plus du mélange normal visibles/cachées qui comble le
  // reste jusqu'à `count`.
  // Utilise Math.random() (donc la seed en cours).
  function addLinkedPairs(fullWall, count, minVisible = 0) {
    if (count <= 0) return;
    const rows = fullWall.length, cols = fullWall[0].length;
    const visRows = Math.min(WALL_ROWS, rows);
    let linkId = 0;
    const used = new Set();
    const tryAdd = ([r1, c1, r2, c2]) => {
      const a = fullWall[r1][c1], b = fullWall[r2][c2];
      if (!a || !b) return false;
      if (used.has(a) || used.has(b)) return false;
      a.linkId = linkId; b.linkId = linkId;
      used.add(a); used.add(b);
      linkId++;
      return true;
    };

    // Voisins immédiats d'une cellule (r,c) : droite, diag bas-droite,
    // diag bas-gauche. PAS de "dessous" pur : les duos ne doivent jamais
    // être verticaux, seulement horizontaux ou diagonaux.
    const neighborsOf = (r, c) => {
      const out = [];
      if (c + 1 < cols) out.push([r, c + 1]);
      if (r + 1 < rows && c + 1 < cols) out.push([r + 1, c + 1]);
      if (r + 1 < rows && c - 1 >= 0) out.push([r + 1, c - 1]);
      return out;
    };

    const cand = [];      // les deux canons dans la partie visible
    const hiddenCand = []; // au moins un des deux caché
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cn = fullWall[r][c];
        if (!cn) continue;
        for (const [r2, c2] of neighborsOf(r, c)) {
          const cn2 = fullWall[r2][c2];
          if (!cn2 || cn2.color === cn.color) continue;
          const pair = [r, c, r2, c2];
          if (r2 < visRows) { cand.push(pair); continue; }
          hiddenCand.push(pair);
        }
      }
    }
    shuf(cand);
    shuf(hiddenCand);

    // D'abord un minimum garanti de paires visibles...
    for (const pair of cand) {
      if (linkId >= minVisible) break;
      tryAdd(pair);
    }
    // ...puis le reste (visibles restantes + cachées) mélangé jusqu'à count.
    const merged = cand.concat(hiddenCand);
    shuf(merged);
    for (const pair of merged) {
      if (linkId >= count) break;
      tryAdd(pair);
    }
  }

  function clearLinkedPairs(fullWall) {
    for (const row of fullWall) for (const cn of row) if (cn) delete cn.linkId;
  }

  // Variante du solveur qui connaît la règle des paires liées : quand un
  // coup retire un canon lié (sans compléter son combo), son partenaire
  // est retiré EN MÊME TEMPS de la simulation (où qu'il soit).
  function solvableWithLinks(full, margin) {
    const start = splitWall(full);
    const CAP = tapisCap() - (margin || 0);
    let nodes = 0;
    const seen = new Set();

    function findInReserve(res, linkId, exclude) {
      for (let c = 0; c < res.length; c++)
        for (let i = 0; i < res[c].length; i++) {
          const x = res[c][i];
          if (x && x !== exclude && x.linkId === linkId) return [c, i];
        }
      return null;
    }

    function rec(g, res, tapis) {
      if (++nodes > 60000) return false;
      let empty = true;
      for (const row of g) for (const x of row) if (x) { empty = false; break; }
      if (empty && res.every(s => !s.length)) return Object.values(tapis).every(v => !v);
      let k = '';
      for (const row of g) for (const x of row) k += x ? (x.color + (x.linkId != null ? 'L' + x.linkId : '')) : '.';
      k += '|' + res.map(s => s.length).join('.') + '|';
      for (const col in tapis) if (tapis[col]) k += col + tapis[col];
      if (seen.has(k)) return false;
      seen.add(k);
      const free = freeCells(g);
      const cand = [];
      for (let r = 0; r < g.length; r++)
        for (let c = 0; c < g[0].length; c++) if (free[r][c]) cand.push([r, c]);
      cand.sort((a, b) => (tapis[g[b[0]][b[1]].color] || 0) - (tapis[g[a[0]][a[1]].color] || 0));
      let n = 0;
      for (const [r, c] of cand) {
        if (++n > 6) break;
        const cn = g[r][c];
        const cur = tapis[cn.color] || 0;
        const wouldComplete = cur === 2;
        // Un canon lié peut compléter un combo normalement.
        // Le lien entraîne simplement son partenaire ; il ne bloque jamais
        // la création d'un combo.

        // Détermine s'il faut retirer un partenaire lié avec ce coup
        let partnerWall = null, partnerRes = null;
        const g2 = g.map(row => row.slice());
        const res2 = res.map(s => s.slice());
        g2[r][c] = null;
        if (cn.linkId != null) {
          partnerWall = findLinkedPartnerInGrid(g, cn.linkId, cn);
          // Comme en jeu réel : les deux moitiés doivent être dégagées par
          // le haut (rien au-dessus dans leur colonne) — pas seulement
          // "atteignable par un détour".
          if (partnerWall && (!columnClear(g, r, c) || !columnClear(g, partnerWall[0], partnerWall[1]))) continue;
          if (!partnerWall) partnerRes = findInReserve(res, cn.linkId, cn);
        }

        let t2 = Object.assign({}, tapis);
        const applyOne = (color) => {
          const cc = t2[color] || 0;
          if (cc === 2) t2[color] = 0; else t2[color] = cc + 1;
        };
        applyOne(cn.color);
        if (partnerWall) {
          const pColor = g[partnerWall[0]][partnerWall[1]].color;
          g2[partnerWall[0]][partnerWall[1]] = null;
          applyOne(pColor);
        }
        if (partnerRes) { const pc = res2[partnerRes[0]][partnerRes[1]].color; res2[partnerRes[0]].splice(partnerRes[1], 1); applyOne(pc); }
        applyRefill(g2, res2);

        let size = 0; for (const col in t2) size += t2[col];
        if (size >= CAP) continue;
        if (rec(g2, res2, t2)) return true;
      }
      return false;
    }
    return rec(start.g, start.res, {});
  }

  // Nombre de paires proportionnel au nombre de couleurs du dessin
  function linkedPairCountFor(colorCount) {
    return Math.max(6, Math.min(16, Math.floor(colorCount / 1.5)));
  }

  function wallSolvable(g0) {
    const rows = g0.length, cols = g0[0].length;
    const g = g0.map(r => r.slice());
    const tapis = {};
    const CAP = tapisCap();
    let tapisN = 0, nodes = 0;
    const failed = new Set();

    function key() {
      let k = '';
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) k += g[r][c] ? '1' : '0';
      k += '|';
      for (const col in tapis) if (tapis[col]) k += col + tapis[col];
      return k;
    }
    function dfs() {
      if (++nodes > 200000) return false;
      let empty = true;
      outer: for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          if (g[r][c]) { empty = false; break outer; }
      if (empty) return tapisN === 0;
      const k = key();
      if (failed.has(k)) return false;
      const free = freeCells(g);
      const cand = [];
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          if (free[r][c]) cand.push([r, c]);
      cand.sort((a, b) => (tapis[g[b[0]][b[1]].color] || 0) - (tapis[g[a[0]][a[1]].color] || 0));
      for (const [r, c] of cand) {
        const cn = g[r][c];
        const col = cn.color;
        const cur = tapis[col] || 0;
        g[r][c] = null;
        if (cur === 2) { tapis[col] = 0; tapisN -= 2; }
        else { tapis[col] = cur + 1; tapisN += 1; }
        const ok = tapisN < CAP && dfs();
        if (cur === 2) { tapis[col] = 2; tapisN += 2; }
        else { tapis[col] = cur; tapisN -= 1; }
        g[r][c] = cn;
        if (ok) return true;
      }
      failed.add(k);
      return false;
    }
    return dfs();
  }

  // Mélange par fenêtres glissantes (préserve grossièrement les couches)
  function windowShuffle(pile, win) {
    const p = pile.slice();
    const off = 0 | Math.random() * win;
    for (let i = -off; i < p.length; i += win) {
      const a = Math.max(0, i), b = Math.min(p.length, i + win);
      const seg = p.slice(a, b);
      shuf(seg);
      for (let j = 0; j < seg.length; j++) p[a + j] = seg[j];
    }
    return p;
  }

  // Arrange le mur selon le palier de difficulté
  function buildWall(base) {
    const cols = wallCols(base.length);
    const tier = effectiveTier();

    // FACILE : léger mélange (fenêtre 6), validé gagnable par le VRAI solveur
    // (solvableWithReserve). Note : l'ancien code validait avec greedyWins()
    // (un joueur "instinct" à 1 coup d'avance) — ce test échoue quasiment
    // toujours (mesuré empiriquement : 0/60), donc le niveau facile retombait
    // presque systématiquement sur l'ordre brut non mélangé, pas toujours
    // facile à lire pour un joueur réel. solvableWithReserve donne des murs
    // plus fiablement jouables.
    if (tier === 'facile') {
      for (let attempt = 0; attempt < 40; attempt++) {
        const g = dealGrid(windowShuffle(base, 6), cols);
        if (solvableWithReserve(g)) return g;
      }
      for (let attempt = 0; attempt < 30; attempt++) {
        const g = dealGrid(windowShuffle(base, 3), cols);
        if (solvableWithReserve(g)) return g;
      }
      return dealGrid(base, cols);
    }

    // DIFFICILE : mur aussi large que les autres, mélange poussé pour bien
    // mélanger les couleurs, mais TOUJOURS validé gagnable par le solveur.
    // Le joueur doit pouvoir se bloquer par une mauvaise décision, jamais
    // à cause d'un mur généré perdant d'avance.
    // IMPORTANT : on ne fait JAMAIS de mélange total (shuf() sur tout le
    // pile). Un mélange total n'est validé "gagnable" que par une recherche
    // profonde du solveur (largeur bornée, mémoïsation) qui trouve une
    // séquence quasi optimale — pas une séquence qu'un joueur réel découvre
    // en jouant à l'instinct. On reste donc sur un mélange fenêtré. Mesuré
    // empiriquement : une fenêtre de 24 (trop large) retombe presque au
    // niveau du mélange total en jouabilité réelle ; le point optimal se
    // situe autour de 10-14, qu'on tente donc en premier.
    if (tier === 'difficile') {
      for (const win of [14, 10, 18, 7, 5, 3]) {
        for (let attempt = 0; attempt < 30; attempt++) {
          const g = dealGrid(windowShuffle(base, win), cols);
          if (solvableWithReserve(g)) return g;
        }
      }
      // Dernier recours garanti gagnable : l'ordre de base non mélangé
      // (voir buildOrderedPile : toujours solvable avec 5 emplacements).
      return dealGrid(base, cols);
    }

    // MOYEN : mur aussi large, gros mélange, mais TOUJOURS validé gagnable
    // par le solveur : il faut planifier, jamais deviner
    for (let attempt = 0; attempt < 25; attempt++) {
      const g = dealGrid(windowShuffle(base, 18), cols);
      if (solvableWithReserve(g)) return g;
    }
    for (let attempt = 0; attempt < 20; attempt++) {
      const g = dealGrid(windowShuffle(base, 6), cols);
      if (greedyWins(g)) return g;
    }
    return dealGrid(base, cols); // repli sûr
  }

  // Une colonne entièrement vide se recharge avec SA propre pile, par le bas
  // Une seule passe par colonne, appelée après chaque prise :
  // 1) les canons déjà visibles se tassent vers le haut pour combler les
  //    trous laissés par ce qui vient d'être pris ;
  // 2) les cases encore vides en bas de la colonne sont comblées avec la
  //    réserve cachée, dès qu'il y a de la place — plus besoin d'attendre
  //    que toute la colonne soit vide.
  function settleWall() {
    if (!wall.length) return [];
    const rows = wall.length, cols = wall[0].length;
    const changed = [];
    for (let c = 0; c < cols; c++) {
      const before = [];
      for (let r = 0; r < rows; r++) before.push(wall[r][c]);
      const items = before.filter(x => x);
      for (let r = 0; r < rows; r++) wall[r][c] = r < items.length ? items[r] : null;
      const stack = colStacks[c];
      if (stack && stack.length) {
        for (let r = rows - 1; r >= 0 && stack.length; r--) {
          if (!wall[r][c]) wall[r][c] = stack.shift();
        }
      }
      for (let r = 0; r < rows; r++) if (wall[r][c] !== before[r]) changed.push([r, c]);
    }
    return changed;
  }

  // ── BONUS : actions ─────────────────────────────────────────────────────

  function updateBonusUI() {
    const bS = $('bonusShuffle'), bA = $('bonusSlot'), bW = $('bonusWild');
    if (bS) {
      bS.querySelector('.bonus-count').textContent = bonusCharges.shuffle;
      bS.disabled = bonusCharges.shuffle <= 0 || gameOver;
    }
    if (bA) {
      bA.querySelector('.bonus-count').textContent = bonusCharges.slot;
      bA.disabled = bonusCharges.slot <= 0 || extraSlots >= MAX_EXTRA_SLOTS || gameOver;
    }
    if (bW) {
      bW.querySelector('.bonus-count').textContent = bonusCharges.wild;
      bW.disabled = bonusCharges.wild <= 0 || gameOver;
      bW.classList.toggle('armed', wildArmed);
    }
    $('cannonsBox') && $('cannonsBox').classList.toggle('wild-armed', wildArmed);
  }

  // Bonus 1 : mélange la position des canons déjà posés sur le mur
  function useBonusShuffle() {
    if (gameOver || bonusCharges.shuffle <= 0) return;
    const cells = [];
    for (let r = 0; r < wall.length; r++)
      for (let c = 0; c < wall[r].length; c++)
        if (wall[r][c]) cells.push([r, c]);
    if (cells.length < 2) return;

    // FLIP : on capture la position actuelle de chaque canon (par id),
    // AVANT le mélange, pour pouvoir ensuite l'animer vers sa nouvelle case.
    const grid = $('cannonsBox').querySelector('.wall-grid');
    const oldRects = new Map();
    if (grid) {
      for (const [r, c] of cells) {
        const cellEl = grid.querySelector(`[data-r="${r}"][data-c="${c}"]`);
        const barrel = cellEl && cellEl.querySelector('.cannon');
        if (barrel) oldRects.set(wall[r][c].id, barrel.getBoundingClientRect());
      }
    }

    const cannons = cells.map(([r, c]) => wall[r][c]);
    shuf(cannons);
    cells.forEach(([r, c], i) => { wall[r][c] = cannons[i]; });

    bonusCharges.shuffle--;
    window._cannonMoving = true; // fige la taille des cases pendant l'animation
    renderCannonLines();
    updateBonusUI();
    setSt('Mur mélangé !', 'ok');

    requestAnimationFrame(() => {
      const newGrid = $('cannonsBox').querySelector('.wall-grid');
      if (!newGrid) { window._cannonMoving = false; return; }
      for (const [r, c] of cells) {
        const cn = wall[r][c];
        const oldRect = cn && oldRects.get(cn.id);
        const cellEl = newGrid.querySelector(`[data-r="${r}"][data-c="${c}"]`);
        const barrel = cellEl && cellEl.querySelector('.cannon');
        if (!barrel || !oldRect) continue;
        const newRect = barrel.getBoundingClientRect();
        const dx = oldRect.left - newRect.left;
        const dy = oldRect.top - newRect.top;
        if (!dx && !dy) continue;
        barrel.style.transition = 'none';
        barrel.style.transform = `translate(${dx}px, ${dy}px)`;
        barrel.style.zIndex = 5;
        barrel.getBoundingClientRect(); // force reflow
        barrel.style.transition = 'transform 340ms cubic-bezier(.22,1,.36,1)';
        barrel.style.transform = '';
      }
      setTimeout(() => {
        const g = $('cannonsBox').querySelector('.wall-grid');
        if (g) g.querySelectorAll('.cannon').forEach(el => {
          el.style.transition = ''; el.style.zIndex = ''; el.style.transform = '';
        });
        window._cannonMoving = false;
      }, 360);
    });
  }

  // Bonus 2 : ajoute une case (permanente pour ce niveau) à la zone de tir
  function useBonusSlot() {
    if (gameOver || bonusCharges.slot <= 0 || extraSlots >= MAX_EXTRA_SLOTS) return;
    bonusCharges.slot--;
    extraSlots++;
    updateSlotLocks();
    updateBeltCount();
    updateBonusUI();
    setSt('+1 case de tir !', 'ok');
  }

  // Bonus 3 : arme/désarme la sélection libre (n'importe quel canon du mur,
  // même enterré). La charge n'est consommée qu'au moment d'un vrai usage.
  function useBonusWild() {
    if (gameOver || bonusCharges.wild <= 0) return;
    wildArmed = !wildArmed;
    updateBonusUI();
    renderCannonLines(); // ré-attache les handlers de clic sur les canons enterrés
    if (wildArmed) setSt('Choisis n\'importe quel canon sur le mur...', 'ok');
  }

  // Extraction forcée : ignore le chemin de sortie, utilisée par le bonus joker.
  // Paire liée : même règle que takeFromWall — le partenaire est entraîné
  // avec lui, où qu'il soit (mur ou réserve). Comme le Joker ignore déjà le
  // chemin pour le canon principal, il l'ignore aussi pour le partenaire :
  // les deux sortent de force, sans vérification d'accessibilité.
  function takeFromWallWild(r, c) {
    if (gameOver) return;
    const cn = wall[r] && wall[r][c];
    if (!cn) return;

    // Un partenaire encore caché peut être entraîné directement par le duo
    // et sera révélé dès son arrivée dans la zone de tir.
    const partnerLoc = cn.linkId != null ? findLinkedPartnerLive(cn.linkId, cn) : null;

    let slot, partnerSlot = null;
    if (partnerLoc) {
      const pair = reserveAdjacentPairSlots();
      if (!pair) { setSt('🔗 Pas assez de place pour la paire liée', 'warn'); return; }
      [slot, partnerSlot] = pair;
    } else {
      slot = getFreeSlot();
      if (!slot) { setSt('Tapis plein — attends la fin du combo en cours', 'warn'); return; }
    }

    bonusCharges.wild--;
    wildArmed = false;
    updateBonusUI();

    wall[r][c] = null;
    if (partnerLoc && partnerLoc.type === 'wall') wall[partnerLoc.r][partnerLoc.c] = null;
    else if (partnerLoc && partnerLoc.type === 'res') colStacks[partnerLoc.c].splice(partnerLoc.i, 1);
    const changed = settleWall();
    renderCannonLines();
    if (changed.length) animateRise(changed);

    sendToFireZone(cn, slot);
    if (partnerLoc) {
      setSt('🔗 Un canon lié a été entraîné avec lui !', 'warn');
      sendToFireZone(partnerLoc.cn, partnerSlot);
    }
  }

  // Cherche le partenaire lié d'un canon, dans le mur visible ou la réserve
  // cachée (colStacks), pour la vraie partie en cours (pas le solveur).
  function findLinkedPartnerLive(linkId, exclude) {
    for (let r = 0; r < wall.length; r++)
      for (let c = 0; c < wall[0].length; c++) {
        const x = wall[r][c];
        if (x && x !== exclude && x.linkId === linkId) return { type: 'wall', r, c, cn: x };
      }
    for (let c = 0; c < colStacks.length; c++)
      for (let i = 0; i < colStacks[c].length; i++) {
        const x = colStacks[c][i];
        if (x && x !== exclude && x.linkId === linkId) return { type: 'res', c, i, cn: x };
      }
    return null;
  }

  // Entraîne le partenaire lié : sort du mur (animation simple, vol direct
  // vers le haut) ou de la réserve cachée (pas de case visible, sort direct).
  function pullLinkedPartner(loc, slot, done) {
    if (loc.type === 'wall') {
      wall[loc.r][loc.c] = null;
      const changed = settleWall();
      renderCannonLines();
      if (changed.length) animateRise(changed);
      const straightPath = [[loc.r, loc.c], [-1, loc.c]];
      animateExit(loc.cn, straightPath, slot, () => {
        slot.reserved = false;
        sendToFireZone(loc.cn, slot);
        done();
      });
    } else {
      colStacks[loc.c].splice(loc.i, 1);
      slot.reserved = false;
      sendToFireZone(loc.cn, slot);
      done();
    }
  }

  function takeFromWall(r, c) {
    if (gameOver) return;
    const cn = wall[r] && wall[r][c];
    if (!cn) return;
    const path = findExitPath(wall, r, c);
    if (!path) return;

    // Paire liée : le canon pris entraîne toujours son partenaire avec lui,
