          el.style.transition = ''; el.style.zIndex = ''; el.style.transform = '';
        });
        window._cannonMoving = false;
      }, 360);
    });
  }

  // Bonus 2 : ajoute une case (permanente pour ce niveau) à la zone de tir
  function useBonusSlot() {
    if (gameOver || bonusCharges.slot <= 0 || extraSlots >= MAX_EXTRA_SLOTS) return;
    bonusCharges.slot--;
    extraSlots++;
    updateSlotLocks();
    updateBeltCount();
    lockAllBonuses();
    setSt('+1 case de tir !', 'ok');
  }

  // Bonus 3 : arme/désarme la sélection libre (n'importe quel canon du mur,
  // même enterré). La charge n'est consommée qu'au moment d'un vrai usage.
  function useBonusWild() {
    if (gameOver || bonusCharges.wild <= 0) return;
    wildArmed = !wildArmed;
    updateBonusUI();
    renderCannonLines(); // ré-attache les handlers de clic sur les canons enterrés
    if (wildArmed) setSt('Choisis n\'importe quel canon sur le mur...', 'ok');
  }

  // Extraction forcée : ignore le chemin de sortie, utilisée par le bonus joker.
  // Paire liée : même règle que takeFromWall — le partenaire est entraîné
  // avec lui, où qu'il soit (mur ou réserve). Comme le Joker ignore déjà le
  // chemin pour le canon principal, il l'ignore aussi pour le partenaire :
  // les deux sortent de force, sans vérification d'accessibilité.
  function takeFromWallWild(r, c) {
    if (gameOver) return;
    const cn = wall[r] && wall[r][c];
    if (!cn) return;

    // Un partenaire encore caché peut être entraîné directement par le duo
    // et sera révélé dès son arrivée dans la zone de tir.
    const partnerLoc = cn.linkId != null ? findLinkedPartnerLive(cn.linkId, cn) : null;

    let slot, partnerSlot = null;
    if (partnerLoc) {
      const pair = reserveAdjacentPairSlots();
      if (!pair) { setSt('🔗 Pas assez de place pour la paire liée', 'warn'); return; }
      [slot, partnerSlot] = pair;
    } else {
      slot = getFreeSlot();
      if (!slot) { setSt('Tapis plein — attends la fin du combo en cours', 'warn'); return; }
    }

    bonusCharges.wild--;
    wildArmed = false;
    lockAllBonuses();

    wall[r][c] = null;
    if (partnerLoc && partnerLoc.type === 'wall') wall[partnerLoc.r][partnerLoc.c] = null;
    else if (partnerLoc && partnerLoc.type === 'res') colStacks[partnerLoc.c].splice(partnerLoc.i, 1);
    const changed = settleWall();
    renderCannonLines();
    if (changed.length) animateRise(changed);

    sendToFireZone(cn, slot);
    if (partnerLoc) {
      setSt('🔗 Un canon lié a été entraîné avec lui !', 'warn');
      sendToFireZone(partnerLoc.cn, partnerSlot);
    }
  }

  // Cherche le partenaire lié d'un canon, dans le mur visible ou la réserve
  // cachée (colStacks), pour la vraie partie en cours (pas le solveur).
  function findLinkedPartnerLive(linkId, exclude) {
    for (let r = 0; r < wall.length; r++)
      for (let c = 0; c < wall[0].length; c++) {
        const x = wall[r][c];
        if (x && x !== exclude && x.linkId === linkId) return { type: 'wall', r, c, cn: x };
      }
    for (let c = 0; c < colStacks.length; c++)
      for (let i = 0; i < colStacks[c].length; i++) {
        const x = colStacks[c][i];
        if (x && x !== exclude && x.linkId === linkId) return { type: 'res', c, i, cn: x };
      }
    return null;
  }

  // Entraîne le partenaire lié : sort du mur (animation simple, vol direct
  // vers le haut) ou de la réserve cachée (pas de case visible, sort direct).
  function pullLinkedPartner(loc, slot, done) {
    if (loc.type === 'wall') {
      wall[loc.r][loc.c] = null;
      const changed = settleWall();
      renderCannonLines();
      if (changed.length) animateRise(changed);
      const straightPath = [[loc.r, loc.c], [-1, loc.c]];
      animateExit(loc.cn, straightPath, slot, () => {
        slot.reserved = false;
        sendToFireZone(loc.cn, slot);
        done();
      });
    } else {
      colStacks[loc.c].splice(loc.i, 1);
      slot.reserved = false;
      sendToFireZone(loc.cn, slot);
      done();
    }
  }

  function takeFromWall(r, c) {
    if (gameOver) return;
    const cn = wall[r] && wall[r][c];
    if (!cn) return;
    const path = findExitPath(wall, r, c);
    if (!path) return;

    // Paire liée : le canon pris entraîne toujours son partenaire avec lui,
    // même s'il est le 3ème canon de sa couleur et complète donc un combo.
    // Le lien ne se casse jamais. La seule condition supplémentaire est qu'il
    // reste assez de place dans la zone de tir pour accueillir les deux canons.
    // Le partenaire est entraîné avec lui, où qu'il soit dans le mur ou la
    // réserve — MAIS seulement si ce
    // partenaire est réellement accessible UNE FOIS LE CANON PRINCIPAL
    // RETIRÉ (celui-ci peut lui-même être l'obstacle juste au-dessus du
    // partenaire, et il part dans la même action) : un partenaire caché en
    // réserve sort toujours librement, alors qu'un partenaire visible encore
    // enterré APRÈS le retrait du principal ne peut pas sortir. Dans ce cas,
    // la paire n'est pas utilisable tant que le chemin ne le permet pas.
    let partnerLoc = null;
    if (cn.linkId != null) {
      // Le partenaire peut encore être caché dans la réserve : le prendre
      // entraîne alors le canon mystère directement dans la zone de tir, où
      // sa vraie couleur est immédiatement révélée.
      const loc = findLinkedPartnerLive(cn.linkId, cn);
      if (loc) {
        if (loc.type === 'wall') {
          // Si le partenaire est déjà dans le mur visible, il doit lui aussi
          // être dégagé pour que la paire soit prenable.
          if (!columnClear(wall, r, c) || !columnClear(wall, loc.r, loc.c)) {
            setSt('🔗 Ce duo doit d’abord être dégagé par le haut — libère ce qui est au-dessus', 'warn');
            return;
          }
        }
        partnerLoc = loc;
      }
    }

    let slot, partnerSlot = null;
    if (partnerLoc) {
      const pair = reserveAdjacentPairSlots();
      if (!pair) { setSt('🔗 Pas assez de place pour la paire liée', 'warn'); return; }
      [slot, partnerSlot] = pair;
    } else {
      slot = getFreeSlot();
      if (!slot) { setSt('Tapis plein — attends la fin du combo en cours', 'warn'); return; }
    }
    slot.reserved = true;
    if (partnerSlot) partnerSlot.reserved = true;

    // Verrouille la taille visuelle pendant tout le déplacement du canon.
    window._cannonMoving = true;

    wall[r][c] = null;             // la case devient un trou immédiatement
    const changed = settleWall();          // colonnes tassées vers le haut + réserve comblée en dessous
    renderCannonLines();           // d'abord re-rendre (l'animation mesure la grille à jour)
    if (changed.length) animateRise(changed);

    let pending = partnerLoc ? 2 : 1;
    const onOneDone = () => { if (--pending <= 0) window._cannonMoving = false; };

    animateExit(cn, path, slot, () => {
      slot.reserved = false;
      sendToFireZone(cn, slot);
      onOneDone();
    });

    if (partnerLoc) {
      setSt('🔗 Un canon lié a été entraîné avec lui !', 'warn');
      pullLinkedPartner(partnerLoc, partnerSlot, onOneDone);
    }
  }

  // Les canons rechargés remontent depuis le bas de leur colonne, en cascade
  function animateRise(cells) {
    const grid = $('cannonsBox').querySelector('.wall-grid');
    if (!grid) return;
    // Du bas vers le haut : le premier arrivé est le plus bas
    const sorted = cells.slice().sort((a, b) => b[0] - a[0]);
    sorted.forEach(([r, c], i) => {
      const cell = grid.querySelector(`[data-r="${r}"][data-c="${c}"]`);
      const el = cell && cell.firstChild;
      if (!el) return;
      el.style.animationDelay = (i * 55) + 'ms';
      el.classList.add('rising');
    });
  }

  // Fait voyager le canon case par case le long de son chemin, puis au tapis
  function animateExit(cn, path, slot, done) {
    // Requête en direct : la grille peut être re-rendue pendant le vol
    const cellAt = (r, c) => {
      const g = $('cannonsBox').querySelector('.wall-grid');
      return g && g.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    };
    const first = cellAt(path[0][0], path[0][1]);
    if (!first) { done(); return; }
    const fr = first.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'cannon wall-cn wall-fly';
    fly.innerHTML = `<div class="cannon-barrel ${CI[cn.color].b}"></div>`;
    fly.style.cssText = `position:fixed;z-index:60;left:${fr.left}px;top:${fr.top}px;width:${fr.width}px;height:${fr.height}px;margin:0;transition:left 70ms linear, top 70ms linear;`;
    document.body.appendChild(fly);

    let step = 1;
    function next() {
      if (step < path.length) {
        const [r, c] = path[step];
        let x, y;
        if (r < 0) { // sortie au-dessus du mur
          const ref = cellAt(0, c);
          if (!ref) { fly.remove(); done(); return; }
          const rr = ref.getBoundingClientRect();
          x = rr.left; y = rr.top - rr.height - 4;
        } else {
          const el = cellAt(r, c);
          if (!el) { fly.remove(); done(); return; }
          const rr = el.getBoundingClientRect();
          x = rr.left; y = rr.top;
        }
        fly.style.left = x + 'px';
        fly.style.top  = y + 'px';
        step++;
        setTimeout(next, 72);
      } else {
        const sr = slot.el.getBoundingClientRect();
        fly.style.transition = 'left 180ms ease-in, top 180ms ease-in, transform 180ms ease-in';
        fly.style.left = (sr.left + sr.width / 2 - fly.offsetWidth / 2) + 'px';
        fly.style.top  = (sr.top + sr.height / 2 - fly.offsetHeight / 2) + 'px';
        fly.style.transform = 'scale(.8)';
        setTimeout(() => { fly.remove(); done(); }, 190);
      }
    }
    setTimeout(next, 20);
  }

  // Plan de tir d'un canon pour les lignes restantes
  function makePlanAll(cn) {
    const plan = [];
    if (fillDir === 'up') {
      for (let r = NR - 1; r >= 0; r--)
        for (let c = 0; c < NC; c++)
          if (T[r][c] === cn.color && !placed[r][c]) plan.push({r, c});
    } else {
      for (let r = 0; r < NR; r++)
        for (let c = 0; c < NC; c++)
          if (T[r][c] === cn.color && !placed[r][c]) plan.push({r, c});
    }
    return plan;
  }

  // Calcul dynamique de la taille des cases du mur pour qu'il s'adapte à l'écran
  function setWallCellSize(cols) {
    const box = $('cannonsBox');
    const maxW = box ? box.clientWidth - 20 : 340;
    const gap = 4;
    const size = Math.floor((maxW - (cols - 1) * gap) / cols);
    const clamped = Math.max(32, Math.min(64, size));
    document.documentElement.style.setProperty('--wc', clamped + 'px');
    setFireSlotSize();
  }

  // Taille des slots de la zone de tir : basée sur --wc pour rester visuellement
  // cohérente avec le mur de canons, mais toujours plafonnée pour que les 5
  // slots tiennent dans la largeur réellement disponible (jamais de débordement).
  function setFireSlotSize() {
    const zone = fireZoneEl;
    if (!zone) return;
    const wc = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--wc')) || 32;
    const style = getComputedStyle(zone);
    const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
    const gap = parseFloat(style.gap) || 5;
    const maxW = zone.clientWidth - padX;
    // largeur d'un slot = fs + 10 (voir CSS .fire-slot)
    const maxFs = Math.floor((maxW - gap * (MAX_BELT - 1)) / MAX_BELT) - 10;
    const clamped = Math.max(20, Math.min(wc, maxFs));
    document.documentElement.style.setProperty('--fs', clamped + 'px');
    invalidateRectCache();
  }

  function renderCannonLines() {
    const box = $('cannonsBox');
    box.innerHTML = '';
    if (!wall.length) return;
    const rows = wall.length, cols = wall[0].length;
    if (!window._cannonMoving) setWallCellSize(cols);

    const free = freeCells(wall);
    // Couleurs déjà à 2 dans la zone de tir (en attente) : un canon lié de
    // cette couleur ne peut pas être pris (il compléterait le combo en
    // cassant son lien, ce qui n'est plus permis).
    const colorAt2 = new Set();
    for (const color in CI) {
      const n = fireSlots.filter(s => s.cannon && !s.firing && s.cannon.color === color).length;
      if (n >= 2) colorAt2.add(color);
    }
    const wrap = document.createElement('div');
    wrap.className = 'wall-grid-wrap';
    const grid = document.createElement('div');
    grid.className = 'wall-grid';
    grid.style.gridTemplateColumns = `repeat(${cols}, var(--wc, 40px))`;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cn = wall[r][c];
        const cell = document.createElement('div');
        cell.className = 'wall-cell' + (!cn ? ' hole' : '');
        cell.dataset.r = r; cell.dataset.c = c;

        if (cn) {
          // Pour un canon lié, ne pas se fier uniquement à freeCells (qui ne
          // juge que CE canon seul) : si son partenaire est encore dans le
          // mur, la paire entière doit être columnClear des deux côtés,
          // sinon on n'affiche pas "accessible" même si ce canon-ci, pris
          // isolément, aurait un chemin.
          let isFree = free[r][c];
          if (cn.linkId != null) {
            const partnerCell = findLinkedPartnerInGrid(wall, cn.linkId, cn);
            // Règle stricte des canons liés : tant que le partenaire n'est
            // pas lui aussi visible dans le mur, ce canon est totalement
            // indisponible. Il ne doit pas pouvoir partir seul vers le tir,
            // y compris via le Joker.
            if (partnerCell) {
              if (isFree && (!columnClear(wall, r, c) || !columnClear(wall, partnerCell[0], partnerCell[1]))) {
                isFree = false;
              }
            } else {
              // Partenaire encore caché : le canon visible reste prenable.
              // Le partenaire mystère sera entraîné depuis la réserve.
              if (!isFree) isFree = false;
            }
          }
          const el = document.createElement('div');
          el.className = 'cannon wall-cn ' + (isFree ? 'accessible' : 'buried');
          // Un canon mystère garde son '?' tant qu'il n'est pas arrivé sur
          // la première ligne du mur. Dès qu'il atteint la première ligne,
          // sa couleur devient visible. Dans la zone de tir, renderSlot()
          // affiche toujours sa vraie couleur.
          const revealBlocked = cn.revealWhenBlocked && r !== 0;
           el.innerHTML = revealBlocked
             ? `<div class="cannon-barrel cannon-unknown"><span class="cannon-question">?</span></div>`
             : `<div class="cannon-barrel ${CI[cn.color].b}"></div>`;
          if (!gameOver) {
            if (isFree) el.onclick = () => takeFromWall(r, c);
            else if (wildArmed && (cn.linkId == null || findLinkedPartnerInGrid(wall, cn.linkId, cn))) {
              el.onclick = () => takeFromWallWild(r, c);
            }
          }
          cell.appendChild(el);
        }
        grid.appendChild(cell);
      }
    }
    wrap.appendChild(grid);
    box.appendChild(wrap);
    drawLinkRopes(wrap, grid, free);
  }

  // Dessine une corde reliant chaque paire de canons liés. Pour les paires
  // formées entre canons voisins du mur visible (les deux visibles dès le
  // départ), la corde relie directement les deux cases. Pour les paires
  // formées avec un partenaire caché plus profond dans sa colonne (voir
  // addLinkedPairs), la corde part du canon visible et plonge tout droit
  // vers le bas jusqu'au bord de la grille (la frontière visible/caché) —
  // elle reste affichée en permanence, pas seulement une fois le partenaire
  // remonté. Dès que ce partenaire apparaît dans le mur, la corde se
  // "raccorde" normalement entre les deux cases. Si l'un des deux canons est
  // actuellement enterré (pas dans `free`), la paire n'est pas utilisable
  // dans l'immédiat : la corde est affichée en style "bloqué" (atténué) pour
  // le signaler.
  // Une paire liée est réellement utilisable si, en retirant l'un des deux
  // canons (celui-ci doit déjà être libre pour être cliquable), l'autre
  // devient accessible à son tour — le canon retiré peut être son propre
  // obstacle, puisqu'il part dans la même action.
  function isPairUsable(r, c, r2, c2, free) {
    if (!columnClear(wall, r, c) || !columnClear(wall, r2, c2)) return false;
    if (free[r][c]) {
      const v = wall.map(row => row.slice());
      v[r][c] = null;
      if (freeCells(v)[r2][c2]) return true;
    }
    if (free[r2][c2]) {
      const v = wall.map(row => row.slice());
      v[r2][c2] = null;
      if (freeCells(v)[r][c]) return true;
    }
    return false;
  }

  function drawLinkRopes(wrap, grid, free) {
    const seen = new Set();
    const pairs = [];
    const solo = []; // canon dont le partenaire est encore caché en réserve
    for (let r = 0; r < wall.length; r++)
      for (let c = 0; c < wall[0].length; c++) {
        const cn = wall[r][c];
        if (!cn || cn.linkId == null || seen.has(cn.linkId)) continue;
        let found = false;
        for (let r2 = 0; r2 < wall.length && !found; r2++)
          for (let c2 = 0; c2 < wall[0].length; c2++) {
            if (r2 === r && c2 === c) continue;
            const cn2 = wall[r2][c2];
            if (cn2 && cn2.linkId === cn.linkId) {
              pairs.push([r, c, r2, c2, cn.linkId]);
              found = true;
              break;
            }
          }
        seen.add(cn.linkId);
        if (!found) {
          // Ne montrer une corde "vers la réserve" que si le partenaire est
          // VRAIMENT encore caché quelque part dans colStacks. Sinon il a déjà
          // été pris ailleurs (le lien n'existe plus concrètement) et il ne
          // faut afficher aucune corde — sinon on ment au joueur.
          let inReserve = false;
          for (let cc = 0; cc < colStacks.length && !inReserve; cc++)
            for (const x of colStacks[cc]) {
              if (x && x.linkId === cn.linkId) { inReserve = true; break; }
            }
          if (inReserve) solo.push([r, c, cn.linkId]);
        }
      }
    if (!pairs.length && !solo.length) return;

    const gridRect = grid.getBoundingClientRect();
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'link-rope-layer');
    svg.setAttribute('width', gridRect.width);
    svg.setAttribute('height', gridRect.height);

    for (const [r, c, r2, c2, linkId] of pairs) {
      const cellA = grid.querySelector(`[data-r="${r}"][data-c="${c}"]`);
      const cellB = grid.querySelector(`[data-r="${r2}"][data-c="${c2}"]`);
      if (!cellA || !cellB) continue;
      const ra = cellA.getBoundingClientRect(), rb = cellB.getBoundingClientRect();
      const x1 = ra.left - gridRect.left + ra.width / 2, y1 = ra.top - gridRect.top + ra.height / 2;
      const x2 = rb.left - gridRect.left + rb.width / 2, y2 = rb.top - gridRect.top + rb.height / 2;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const usable = isPairUsable(r, c, r2, c2, free);
      g.setAttribute('class', 'rope link-' + (linkId % 6) + (usable ? '' : ' rope-blocked'));
      const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      shadow.setAttribute('x1', x1); shadow.setAttribute('y1', y1 + 1.5);
      shadow.setAttribute('x2', x2); shadow.setAttribute('y2', y2 + 1.5);
      shadow.setAttribute('class', 'rope-shadow');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'rope-line');
      g.appendChild(shadow);
      g.appendChild(line);
      svg.appendChild(g);
    }

    // Paires dont le partenaire est encore caché en réserve : on prolonge
    // quand même la corde, depuis le canon visible tout droit vers le bas,
    // jusqu'à la frontière du mur (bord bas de la grille visible) — comme un
    // fil qui plonge vers la réserve cachée juste en dessous. Le partenaire
    // caché sort toujours librement (pas d'obstacle possible en réserve),
    // donc la corde n'est en style "bloqué" que si le canon visible lui-même
    // est encore enterré.
    for (const [r, c, linkId] of solo) {
      const cellA = grid.querySelector(`[data-r="${r}"][data-c="${c}"]`);
      if (!cellA) continue;
      const ra = cellA.getBoundingClientRect();
      const x1 = ra.left - gridRect.left + ra.width / 2, y1 = ra.top - gridRect.top + ra.height / 2;
      const x2 = x1, y2 = gridRect.height;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const usable = !!free[r][c];
      g.setAttribute('class', 'rope link-' + (linkId % 6) + (usable ? '' : ' rope-blocked'));
      const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      shadow.setAttribute('x1', x1); shadow.setAttribute('y1', y1 + 1.5);
      shadow.setAttribute('x2', x2); shadow.setAttribute('y2', y2 + 1.5);
      shadow.setAttribute('class', 'rope-shadow');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', 'rope-line');
      g.appendChild(shadow);
      g.appendChild(line);
      svg.appendChild(g);
    }
    wrap.appendChild(svg);
  }

  // Sens de remplissage du dessin : 'up' = bas vers le haut, 'down' = haut vers le bas
  // (forcé à 'down' en mode Aventure, réglable en mode Libre)
  let fillDir = 'down';

  // ── PROGRESSION DE LA CAMPAGNE ──────────────────────────────────────────
  // La campagne génère des niveaux à l'infini.
  //   - stage 1, 2, 3...
  //   - le pixel art cycle parmi LEVELS[ (stage-1) % LEVELS.length ]
  //   - la difficulté est determinée par le stage :
  //       stage 1, 2     → Facile
  //       stage 4         → Facile (forcé — niveau "Nuit etoilee")
  //       stage 3, 5      → Moyen
  //       stage >= 6      → Difficile (boucle à l'infini)
  let stage = 1;
  let gameMode = 'adventure'; // Prototype : Aventure uniquement
  let freeLevelIdx = 0;
  let freeTier = 'moyen'; // palier du mode LIBRE : INDÉPENDANT de "stage" (Aventure),
                          // pour que revisiter un niveau en mode libre donne toujours
                          // le même mur, peu importe où on en est en Aventure.
  let linkedPairsMode = false; // conservé pour compatibilité avec d'anciennes sauvegardes
  const LINKED_PAIRS_LEVELS = ['Chemin doré']; // niveaux où le modificateur est proposé

  function tierFor(stg) {
    if (stg <= 2) return 'facile';
    if (stg === 4) return 'facile'; // Nuit etoilee : toujours facile, quel que soit le rang
    if (stg <= 5) return 'moyen';
    return 'difficile';
  }

  // Palier RÉELLEMENT utilisé pour la génération : en mode libre, le palier
  // choisi dans la bibliothèque (freeTier), stable et indépendant de
  // l'Aventure ; en Aventure, le palier normal basé sur la progression.
  function effectiveTier() {
    return tierFor(stage);
  }

  function tapisCap() {
    return BASE_BELT + extraSlots;
  }

  function updateStageUI() {
    const stgLabel = $('stageLabel');
    const badge = $('tierBadge');
    const lvName = ADVENTURE_ORDER[stage - 1] || ADVENTURE_ORDER[0];
    if (stgLabel) stgLabel.textContent = lvName;
    if (badge) {
      const t = tierFor(stage);
      badge.textContent = t.toUpperCase();
      badge.className = 'tier-badge ' + t;
    }
    syncDirBtn();
    saveProgress();
  }

  // ── Sauvegarde locale de la progression (navigateur courant) ─────────
  // Remarque : ceci sauvegarde dans le navigateur (localStorage), pas sur
  // GitHub. Voir les notes plus bas si une synchro multi-appareils est
  // nécessaire.
  const SAVE_KEY = 'pixelCannonProgress';

  function saveProgress() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ stage, gameMode: 'adventure' }));
    } catch(e) {}
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (typeof data.stage === 'number' && data.stage >= 1) {
        stage = Math.min(ADVENTURE_MAX_STAGE, Math.floor(data.stage));
      }
      gameMode = 'adventure';
    } catch(e) {}
  }

  // Le sens de remplissage n'est réglable qu'en mode Libre : en Aventure
  // il est toujours fixé à "haut → bas".
  function syncDirBtn() {
    const dirBtn = $('dirBtn');
    if (!dirBtn) return;
    dirBtn.style.display = 'none';
  }

  // ── PEEK / REVEAL MODE ───────────────────────────────────────────────────
  let peekActive = false;

  function setPeek(active) {
    peekActive = active;
    const btn = $('peekBtn');
    if (btn) {
      btn.classList.toggle('revealed', peekActive);
      btn.textContent = peekActive ? '👁 Visible' : '👁 Aperçu';
    }
    gridEl.classList.toggle('mystery', !peekActive);
  }

  // ── SOUND FX ─────────────────────────────────────────────────────────────
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  // ── Feux d'artifice de victoire ─────────────────────────────────────
  const FW_COLORS = ['#F0AAB4','#28AADC','#F5D060','#2D5A27','#8B4513','#04ADAD','#F3C724','#00ACE9','#FFBB00','#f0f0f0'];

  function fireworkBurst(x, y, color) {
    const layer = document.getElementById('fireworksLayer');
    if (!layer) return;
    // flash au centre de l'explosion
    const flash = document.createElement('div');
    flash.className = 'fw-flash';
    flash.style.cssText = `left:${x - 2}px; top:${y - 2}px;`;
    layer.appendChild(flash);
    setTimeout(() => flash.remove(), 400);

    const count = 16 + Math.floor(Math.random() * 8);
    const c = color || FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const dist = 60 + Math.random() * 70;
      const fx = Math.cos(angle) * dist;
      const fy = Math.sin(angle) * dist;
      const dur = 700 + Math.random() * 500;
      const p = document.createElement('div');
      p.className = 'fw-particle';
      p.style.cssText = `left:${x - 3}px; top:${y - 3}px; background:${c}; --fx:${fx}px; --fy:${fy}px; --fw-dur:${dur}ms;`;
      layer.appendChild(p);
      setTimeout(() => p.remove(), dur + 50);
    }
  }

  // Lance une fusée depuis le bas de l'écran vers (targetX, targetY),
  // puis déclenche l'explosion à l'arrivée.
  function launchRocket(targetX, targetY, color, onArrive) {
    const layer = document.getElementById('fireworksLayer');
    if (!layer) { onArrive(); return; }
    const startY = window.innerHeight + 24;
    const driftX = targetX + (Math.random() * 50 - 25);
    const dur = 550 + Math.random() * 250;

    const rocket = document.createElement('div');
    rocket.className = 'fw-rocket';
    rocket.style.color = color;
    rocket.style.left = (targetX - 2.5) + 'px';
    rocket.style.top = startY + 'px';
    rocket.style.transition = `top ${dur}ms cubic-bezier(.25,.55,.25,1), left ${dur}ms ease-out`;
    layer.appendChild(rocket);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        rocket.style.top = targetY + 'px';
        rocket.style.left = (driftX - 2.5) + 'px';
      });
    });

    setTimeout(() => {
      rocket.remove();
      onArrive();
    }, dur);
  }

  function launchFireworks(duration = 1200) {
    let layer = document.getElementById('fireworksLayer');
    if (!layer) {
      layer = document.createElement('div');
      layer.id = 'fireworksLayer';
      layer.className = 'fireworks-layer';
      document.body.appendChild(layer);
    }
    const w = window.innerWidth, h = window.innerHeight;
    const bursts = 5;
    for (let i = 0; i < bursts; i++) {
      setTimeout(() => {
        const x = w * 0.2 + Math.random() * w * 0.6;
        const y = h * 0.15 + Math.random() * h * 0.4;
        const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
        launchRocket(x, y, color, () => fireworkBurst(x, y, color));
      }, i * (duration / bursts));
    }
    setTimeout(() => { if (layer) layer.remove(); }, duration + 1600);
  }

  const POP_POOL_SIZE = 6;
  const popPool = Array.from({length: POP_POOL_SIZE}, () => {
    const a = new Audio(POP_SOUND_SRC);
    a.volume = 0.55;
    return a;
  });
  let popPoolIdx = 0;

  function playPop() {
    try {
      const a = popPool[popPoolIdx];
      popPoolIdx = (popPoolIdx + 1) % POP_POOL_SIZE;
      a.currentTime = 0;
      a.play().catch(() => {}); // ignore si le navigateur bloque l'autoplay
    } catch(e) {}
  }

  // Petite vibration sur mobile à la pose d'un pixel (si le navigateur le permet)
  function vibrateTap() {
    try {
      if (navigator.vibrate) navigator.vibrate(12);
    } catch(e) {}
  }

  // Map des plans de tir actifs par canon { id -> [{r,c}, ...] }
  const firePlanMap = new Map();


  function markPancakesRevealCannons(fullWall) {
    if (!fullWall.length || !fullWall[0].length) return;
    const cols = fullWall[0].length;
    const HIDDEN_PER_ROW = 1; // Pancakes : un seul canon caché par ligne pour garder la surprise sans rendre le niveau punitif
    for (let r = 0; r < fullWall.length; r++) {
      if (r === 0) {
        // Première ligne : toujours révélée, aucun canon caché.
        for (let c = 0; c < cols; c++) {
          const cn = fullWall[r][c];
          if (cn) cn.revealWhenBlocked = false;
        }
        continue;
      }
      // Autres lignes : seulement HIDDEN_PER_ROW colonnes (tirées au sort,
      // de façon déterministe via le seed du niveau) restent cachées ;
      // les autres canons enterrés affichent directement leur couleur.
      const idx = Array.from({length: cols}, (_, i) => i);
      shuf(idx);
      const hiddenCols = new Set(idx.slice(0, Math.min(HIDDEN_PER_ROW, cols)));
      for (let c = 0; c < cols; c++) {
        const cn = fullWall[r][c];
        if (cn) cn.revealWhenBlocked = hiddenCols.has(c);
      }
    }
  }

  function resetGame() {
    stopAllFire();
    fusedColors.clear();
    firePlanMap.clear();

    const lvIdx = adventureLevelIndex(stage);
    loadLevel(lvIdx);

    placed = Array.from({length: NR}, () => Array(NC).fill(false));
    shots = 0; gameOver = false; placedCount = 0;
    beltCannons = [];

    // Réinitialiser l'effet "case en plus" (propre à ce niveau) et l'arme
    // du joker. Les charges de bonus dépendent simplement du niveau :
    // verrouillées avant BONUS_UNLOCK_STAGE, les 3 disponibles (1 charge
    // chacune) à partir de ce niveau — voir lockAllBonuses() pour la
    // règle "dès qu'on en utilise un, les 3 se reverrouillent".
    extraSlots = 0;
    wildArmed = false;
    bonusCharges = { ...(stage >= BONUS_UNLOCK_STAGE ? BONUS_AVAILABLE : BONUS_LOCKED) };

    // Réinitialiser les slots du tapis
    for (const s of fireSlots) {
      s.cannon = null; s.firing = false;
      if (s.timer) { clearTimeout(s.timer); s.timer = null; }
      renderSlot(s);
    }
    updateBonusUI();

    // Le niveau est divisé en 2-3 couches
    // Chaque couche tire ses canons sous forme de grille à trous
    // Mur DÉTERMINISTE : même niveau + même palier + même direction =
    // toujours le même arrangement, pour pouvoir mémoriser le chemin
    // en rejouant, comme dans un solitaire classique.
    const linksActive = ADVENTURE_LINKED_LEVELS.includes(LEVELS[lvIdx].name);
    const seed = hashSeed(`${LEVELS[lvIdx].name}|${effectiveTier()}|${fillDir}|${linksActive ? 'linked' : 'normal'}`);
    const rng = mulberry32(seed);
    const origRandom = Math.random;
    Math.random = rng;
    let basePile, fullWall;
    try {
      basePile = buildOrderedPile();
      fullWall = buildWall(basePile);

      if (LEVELS[lvIdx].name === 'Pancakes') markPancakesRevealCannons(fullWall);
      if (linksActive) {
        // Pancakes garde les canons liés + cachés, mais avec un dosage plus doux :
        // le niveau contient beaucoup de couleurs, donc appliquer le nombre de
        // paires standard le rendait nettement plus punitif que Chemin doré.
        const isPancakes = LEVELS[lvIdx].name === 'Pancakes';
        const pairCount = isPancakes
          ? 4
          : linkedPairCountFor(Object.keys(CI).length);
        const minVisible = isPancakes ? 2 : 3;
        let ok = false;
        for (let attempt = 0; attempt < 100 && !ok; attempt++) {
          clearLinkedPairs(fullWall);
          addLinkedPairs(fullWall, isPancakes ? pairCount : pairCount + minVisible, minVisible);
          ok = solvableWithLinks(fullWall, 0);
        }
        // Repli garanti gagnable : si aucun placement de paires validé,
        // le niveau reste jouable normalement (sans paires cette fois).
        if (!ok) clearLinkedPairs(fullWall);
      }
    } finally {
      Math.random = origRandom;
    }
    const cols = wallCols(basePile.length);

    // Découper : les 3 premières rangées forment le mur visible,
    // le reste est stocké dans colStacks (une pile cachée PAR COLONNE)
    const { g, res } = splitWall(fullWall);
    wall = g;
    colStacks = res;

    // Déterminer la première ligne non-blanche
    currentRow = fillDir === 'up' ? firstNonWhiteRow(NR - 1) : 0;

    renderGrid();
    renderCannonLines();
    updateBeltCount();
    updateStageUI();
    updStats();
    startWatchdog();
    wO.classList.remove('show');
    gOv.classList.remove('show');
    setSt('Clique sur un canon du mur pour le placer sur le tapis de tir', 'ok');

    // Message rapide (3s) uniquement à l'arrivée au niveau où les bonus
    // se débloquent, pour prévenir le joueur qu'il peut s'en servir.
    if (stage === BONUS_UNLOCK_STAGE) {
      const bt = $('bonusToast');
      if (bt) {
        bt.classList.add('show');
        setTimeout(() => bt.classList.remove('show'), 3000);
      }
    }

    // Le mur de canons ci-dessous vient de changer de hauteur : on recadre
    // la grille maintenant que tout le bas de l'écran est à sa taille finale.
    requestAnimationFrame(fitGrid);
  }

  // Recharger le stage actuel sans incrémenter
  window.retryStage = () => {
    resetGame();
  };

  // Dès que le joueur utilise UN des 3 bonus (à partir du niveau
  // BONUS_UNLOCK_STAGE), les 3 se reverrouillent immédiatement pour le
  // reste du niveau — appelé à la fin de chaque useBonus*.
  function lockAllBonuses() {
    bonusCharges = { ...BONUS_LOCKED };
    updateBonusUI();
  }

  // Passer au stage suivant
  window.nextStage = () => {
    stage = stage >= ADVENTURE_MAX_STAGE ? 1 : stage + 1;
    gameMode = 'adventure';
    fillDir = 'down';
    saveProgress();
    resetGame();
  };

  let totalTarget = 0, placedCount = 0;

  function renderGrid() {
    gridEl.innerHTML = '';
    totalTarget = 0; placedCount = 0;
    // Sur les gros dessins (ex: 51×51 = 2601 cases), ajouter chaque case au DOM
    // une par une force un reflow à chaque fois. On construit tout dans un
    // DocumentFragment hors-DOM, puis on l'insère en une seule opération.
    const frag = document.createDocumentFragment();
    for (let r = 0; r < NR; r++) {
      for (let c = 0; c < NC; c++) {
        const div = document.createElement('div');
        const color = T[r][c];
        if (!CI[color]) {
          // Case vide : fond transparent, ne fait pas partie du dessin
          div.className = 'gc gc-void';
          frag.appendChild(div);
          continue;
        }
        div.className = 'gc ' + GC[color];
        if (placed[r][c]) {
          div.appendChild(makeCube(color));
          placedCount++;
        }
        frag.appendChild(div);
        totalTarget++;
      }
    }
    gridEl.appendChild(frag);
  }

  function makeCube(color) {
    const c = document.createElement('div');
    c.className = 'cube ' + CI[color].c;
    return c;
  }

  function placeCell(r, c) {
    const idx = r * NC + c;
    const cell = gridEl.children[idx];
    if (cell && !cell.querySelector('.cube')) {
      const cube = makeCube(T[r][c]);
      cube.classList.add('pop');
      cell.appendChild(cube);
    }
  }

  function prog() {
    return { d: placedCount, t: totalTarget };
  }

  function updStats() {
    sS.textContent = shots;
    const {d, t} = prog();
    const pct = t ? Math.round(d / t * 100) : 0;
    sP.textContent = pct + '%';
  }

  function setSt(msg, cls) {
    stEl.textContent = msg;
    stEl.className = 'status ' + (cls || '');
  }

  // ── ATTACH EVENTS ────────────────────────────────────────────────────────
  // ── Sélecteur de mode / niveaux ──────────────────────────────────────
  function renderAdventurePath() {
    const wrap = $('pathWrap');
    if (!wrap) return;
    wrap.innerHTML = '';
    const tierLabels = { facile: 'Facile', moyen: 'Moyen', difficile: 'Difficile' };

    // Affichage du parcours de bas en haut, comme dans la version précédente.
    // On n'affiche que le numéro du niveau et sa difficulté.
    [...ADVENTURE_ORDER].reverse().forEach((name, reverseIndex) => {
      const n = ADVENTURE_ORDER.length - reverseIndex;
      const state = n < stage ? 'done' : (n === stage ? 'current' : 'locked');
      const node = document.createElement('div');
      node.className = 'path-node ' + state;
      node.innerHTML = `
        <div class="path-node-circle">${n}</div>
        <div class="path-node-tier">${tierLabels[tierFor(n)]}</div>
      `;
      if (state === 'current') {
        node.onclick = () => { closeLevelSelect(); resetGame(); };
      }
      wrap.appendChild(node);
    });

    requestAnimationFrame(() => {
      const cur = wrap.querySelector('.path-node.current');
      if (cur) cur.scrollIntoView({ block: 'center' });
    });
  }

  function showLvView(view) {
    const adv = $('lvViewAdventure');
    if (adv) adv.style.display = '';
    if (view === 'adventure') renderAdventurePath();
  }

  function openLevelSelect() {
    const ov = $('levelSelectOverlay');
    if (ov) ov.classList.add('show');
    showLvView('adventure');
  }

  function closeLevelSelect() {
    const ov = $('levelSelectOverlay');
    if (ov) ov.classList.remove('show');
  }

  function setupLevelSelect() {
    const openBtn = $('lvSelectBtn');
    if (openBtn) openBtn.onclick = () => openLevelSelect();

    const closeBtn = $('lvCloseBtn');
    if (closeBtn) closeBtn.onclick = closeLevelSelect;

    const playBtn = $('lvPlayBtn');
    if (playBtn) playBtn.onclick = () => {
      gameMode = 'adventure';
      fillDir = 'down';
      closeLevelSelect();
      resetGame();
    };

    const restartAdvBtn = $('lvRestartAdvBtn');
    if (restartAdvBtn) restartAdvBtn.onclick = () => {
      const ok = window.confirm("Recommencer l'aventure depuis le niveau 1 ? Ta progression actuelle sera perdue.");
      if (!ok) return;
      stage = 1;
      gameMode = 'adventure';
      fillDir = 'down';
      saveProgress();
      renderAdventurePath();
      closeLevelSelect();
      resetGame();
    };

    const ov = $('levelSelectOverlay');
    if (ov) {
      ov.addEventListener('click', (e) => {
        if (e.target === ov) closeLevelSelect();
      });
    }
  }

  function setupUI() {
    $('resetBtn').onclick = () => resetGame();

    const bS = $('bonusShuffle'), bA = $('bonusSlot'), bW = $('bonusWild');
    if (bS) bS.onclick = () => useBonusShuffle();
    if (bA) bA.onclick = () => useBonusSlot();
    if (bW) bW.onclick = () => useBonusWild();

    const dirBtn = $('dirBtn');
    if (dirBtn) {
      dirBtn.onclick = () => {
        fillDir = fillDir === 'up' ? 'down' : 'up';
        dirBtn.textContent = fillDir === 'up' ? '⬆ Bas → Haut' : '⬇ Haut → Bas';
        resetGame();
      };
    }

    const peekBtn = $('peekBtn');
    if (peekBtn) {
      peekBtn.onclick = () => setPeek(!peekActive);
    }

    setupLevelSelect();

    window.addEventListener('resize', () => {
      fitGrid();
      if (wall && wall.length && wall[0]) setWallCellSize(wall[0].length);
      else setFireSlotSize();
    });
    fitGrid();
    setFireSlotSize();
  }

  function fitGrid() {
    const sec = document.querySelector('.grid-section');
    if (!sec) return;
    const maxW = sec.clientWidth - 28;
    const maxH = sec.clientHeight - 28;
    // On se cale toujours sur le plus petit côté disponible (carré), puis on
    // divise par le plus grand nombre de lignes/colonnes du dessin : ainsi
    // le CADRE (grid-outer) occupe toujours la même taille d'un dessin à
    // l'autre, seule la taille des cases change selon la résolution.
    const box = Math.max(10, Math.min(maxW, maxH));
    const side = Math.max(1, Math.floor(box / Math.max(NR, NC)));
    document.documentElement.style.setProperty('--cell', side + 'px');
    invalidateRectCache();
  }

  // Auto-init sur clic pour AudioContext
  document.addEventListener('pointerdown', initAudio, { once: true });

  // Lancement
  document.addEventListener('DOMContentLoaded', () => {
    setupUI();
    setPeek(false); // Mode mystère activé par défaut au démarrage
    loadProgress(); // Reprend la progression sauvegardée dans ce navigateur
    resetGame();
    // Au tout premier lancement, on propose toujours le choix du mode
    openLevelSelect('choice');
  });
})();
</script>
</body>
</html>
